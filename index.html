<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MT大冒险 · Zack的日常</title>
<style>
  :root{
    --panel:rgba(18,32,48,.78);
    --panel-border:rgba(255,255,255,.12);
    --text:#f4f6f8;
    --muted:rgba(244,246,248,.82);
    --btn:#c0392b;
    --btn-hover:#d64535;
    --btn-shadow:rgba(120,24,16,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#0e1620;color:var(--text);overflow:hidden;
  }

  .page{
    position:relative;width:100%;height:100%;min-height:100vh;min-height:100dvh;
    overflow:hidden;
  }

  .bg{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center center;
    user-select:none;pointer-events:none;
  }

  .shade{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(8,14,22,.18) 0%,rgba(8,14,22,0) 40%,rgba(8,14,22,.35) 75%,rgba(8,14,22,.78) 100%);
  }

  .dock{
    position:absolute;z-index:2;left:0;right:0;bottom:0;
    padding:0 16px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:12px;
    animation:fadeUp .75s ease both;
  }

  .panel{
    width:min(92vw,520px);padding:clamp(20px,4vw,28px) clamp(20px,4vw,32px) clamp(22px,4vw,30px);
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:18px 18px 14px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 -4px 32px rgba(0,0,0,.28),0 16px 48px rgba(0,0,0,.22);
    text-align:center;
  }

  .hint{
    font-size:clamp(14px,2.6vw,16px);font-weight:500;line-height:1.8;
    color:var(--muted);margin-bottom:clamp(18px,3vh,24px);
  }

  .btn-start{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:min(280px,78vw);padding:14px 36px;
    border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,var(--btn-hover) 0%,var(--btn) 100%);
    color:#fff;font-size:clamp(17px,3.2vw,20px);font-weight:800;letter-spacing:.12em;
    box-shadow:0 6px 0 var(--btn-shadow),0 14px 28px rgba(0,0,0,.28);
    transition:transform .08s ease,box-shadow .08s ease,filter .15s ease;
  }
  .btn-start:hover{filter:brightness(1.06);}
  .btn-start:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 var(--btn-shadow),0 8px 16px rgba(0,0,0,.22);
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(24px);}
    to{opacity:1;transform:translateY(0);}
  }

  @media (max-height:560px){
    .dock{padding-bottom:calc(12px + env(safe-area-inset-bottom));gap:8px;}
    .panel{padding:16px 18px 18px;}
    .hint{margin-bottom:14px;font-size:14px;line-height:1.65;}
    .btn-start{padding:12px 28px;min-width:240px;}
  }
</style>
</head>
<body>
<div class="page">
  <img class="bg" src="assets/images/index.png" alt="Zack 的房间">
  <div class="shade" aria-hidden="true"></div>

  <div class="dock">
    <div class="panel">
      <p class="hint">班上多了，会有什么副作用？<br>容易产生幻想！！！<br>打工人的幻想之——假如我是CEO。</p>
      <button class="btn-start" type="button" onclick="location.href='src/mt-level1-demo.html'">开启CEO的冒险</button>
    </div>
  </div>
</div>
</body>
</html>
