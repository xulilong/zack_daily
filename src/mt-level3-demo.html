  .stat{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;

  .stat .lbl{font-size:10px;font-weight:600;color:var(--muted);}
  .stat.fx.boost{background:#fff6eb;border-color:#d4a574;color:#8a5a28;}
  .stat.fx.crash{background:#fff0f0;border-color:#c98080;color:#8a4040;}
  .stat.fx.slip{background:#fffbe6;border-color:#d4c060;color:#7a6820;}
  .stat.fx.dry{background:#eef6ff;border-color:#7aabcc;color:#3a6080;}
  .stat.fx.smoke{background:#f0f0ee;border-color:#aaa;color:#555;}
  .stage{position:relative;width:100%;background:var(--sky);}
  canvas{display:block;width:100%;height:auto;vertical-align:top;}
  .game-footer{background:var(--paper);border-top:2px solid var(--ink);padding:12px 14px 10px;}
  .pad{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;}
  .pad .group{display:flex;gap:8px;}
  .key{width:58px;height:58px;background:var(--cream);border:2px solid var(--ink);border-radius:12px;
    color:var(--ink);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);font-weight:700;transition:transform .05s,box-shadow .05s,background .12s;}
  .key.run{font-size:12px;letter-spacing:.08em;width:52px;}
  .key.attack{font-size:14px;letter-spacing:.06em;width:52px;}
  .key.jump{font-size:20px;padding-bottom:3px;}
  .key.off{opacity:.38;filter:grayscale(.45);}
  .key.ready{
    background:#eef9f0;border-color:#5a9a68;color:#2d6640;
    animation:spitPulse 1.1s ease infinite;
    box-shadow:0 0 0 2px rgba(126,200,122,.45),0 3px 0 var(--ink);
  }
  @keyframes spitPulse{
    50%{transform:translateY(1px);box-shadow:0 0 0 6px rgba(126,200,122,.32),0 2px 0 var(--ink);}
  }
  .stat.fx.spit{background:#eef9f0;border-color:#7ec87a;color:#2d6640;}
  .spit-unlock{
    position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.94);
    z-index:12;pointer-events:none;text-align:center;min-width:min(88vw,300px);
    background:var(--cream);border:2px solid var(--ink);border-radius:var(--r);
    padding:18px 26px 16px;box-shadow:0 5px 0 var(--ink),0 16px 40px rgba(37,37,37,.18);
    opacity:0;transition:opacity .22s ease,transform .22s ease;
  }
  .spit-unlock.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .spit-unlock strong{display:block;font-size:18px;color:var(--ink);margin-bottom:8px;letter-spacing:.04em;}
  .spit-unlock span{display:block;font-size:13px;color:var(--muted);line-height:1.55;}
  .spit-unlock em{font-style:normal;color:var(--ink);font-weight:800;}
  .help{text-align:center;font-size:10px;color:var(--muted);line-height:1.5;letter-spacing:.02em;}
  .overlay{position:absolute;inset:0;background:rgba(37,37,37,.52);display:none;align-items:center;justify-content:center;z-index:20;}
  .overlay.show{display:flex;}
  .modal{background:var(--cream);border:2px solid var(--ink);border-radius:var(--r);

  .modal h2{font-size:19px;margin-bottom:8px;color:var(--ink);font-weight:800;}
  .modal p{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.6;}

let actx=null, soundOn=true;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==="suspended") actx.resume(); }
function tone(f,dur,type="square",vol=0.18,slideTo=null){
  if(!actx||!soundOn) return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}

function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function isFloatPlat(s){ return s.type==="platform"&&!s.ground; }
function platBlocksX(pb,s){
  if(s===passThroughPlat&&passThroughT>0) return false;
  if(!isFloatPlat(s)||!aabb(pb,s)) return false;
  if(fx.crash>0) return true;           // 停不住时碰到平台就挡
  if(pb.y>=s.y+s.h-2) return false;     // 下蹲时身体低于平台底边 → 可钻过去
  if(player.y+player.h<=s.y+4) return false;
  return true;
}
function platBlocksY(pb,s,dy,prevFeet){
  if(s===passThroughPlat&&passThroughT>0) return false;
  if(!isFloatPlat(s)||!aabb(pb,s)) return false;
  if(dy>0) return prevFeet<=s.y+6;   // 仅能从上方落下
  return false;                       // 从下方穿过，不顶头
}
function solidBlocksX(pb,s){
  if(s.type==="door") return !isDoorOpen(s)&&aabb(pb,s);
  if(s.type==="box"||s.type==="mover") return aabb(pb,s);
  if(isFloatPlat(s)) return platBlocksX(pb,s);
  return aabb(pb,s);
}
function solidBlocksY(pb,s,dy,prevFeet){
  if(s.type==="door") return !isDoorOpen(s)&&aabb(pb,s);
  if(s.type==="box"||s.type==="mover") return aabb(pb,s);
  if(isFloatPlat(s)) return platBlocksY(pb,s,dy,prevFeet);
  return aabb(pb,s);
}
function boxSolidBlocks(b,s){
  if(s.type==="box"||s.type==="mover") return aabb(b,s);
  if(s.type==="door"&&(!isDoorOpen(s))) return aabb(b,s);
  if(!isFloatPlat(s)) return aabb(b,s);
  if(!aabb(b,s)) return false;
  const feet=b.y+b.h;
  if(feet<=s.y+6&&feet>=s.y-4) return true;
  if(feet>s.y+8) return false;
  return true;
}
function tryMountBox(b,s,dx){
  if(!isFloatPlat(s)||!s.boxSlot||!dx) return false;
  if(b.y+b.h>GROUND+2) return false;
  if(b.x+b.w<s.x+4||b.x+b.w>s.x+28) return false;
  b.y=s.y-b.h; b.vy=0;
  if(b.slip) b.vx=(b.vx||0)+Math.abs(dx)*3;
  return true;
}
function isDoorOpen(d){
  const c=d.cycle||4, o=d.openT||1;
  return ((T+(d.phase||0))%c)<o;
}
function solids(){ return ents.filter(e=>(e.type==="platform"&&!e.hidden)||e.type==="box"||e.type==="mover"||(e.type==="door"&&!isDoorOpen(e))); }
function gateBar(g){ return {x:g.x, y:g.y, w:g.w, h:12}; }

function playerBox(){
  const c=player.crouch && player.onGround;
  return {x:player.x+(c?6:0), y:player.y+(c?20:0), w:player.w-(c?12:0), h:player.h-(c?20:0)};
}
function canStompEnemy(pb,en,vy,prevFeet){
  if(vy<=80) return false;
  const feet=pb.y+pb.h;
  if(feet>en.y+16||prevFeet>en.y+8) return false;
  return pb.x+pb.w>en.x+6&&pb.x<en.x+en.w-6;
}

function inPuddle(pb){
  for(const e of ents) if(e.type==="puddle"&&!e.hidden&&aabb(pb,e)) return true;
  return false;
}

function inSpike(pb){
  for(const e of ents) if(e.type==="spike"&&!e.hidden&&aabb(pb,e)) return true;
  return false;
}

function findSafeSpawn(preferX){
  const w=player.w, h=player.h;
  const cands=[];
  for(const s of solids()){
    if(s.hidden) continue;
    const left=Math.max(preferX,s.x), right=Math.min(preferX+w,s.x+s.w);
    if(right<=left) continue;
    const x=Math.max(0,Math.min(WORLD_W-w,left));
    const y=s.y-h;
    if(!inSpike({x,y,w,h})) cands.push({x,y,sy:s.y});
  }
  if(cands.length){
    cands.sort((a,b)=>b.sy-a.sy);
    return {x:cands[0].x,y:cands[0].y,facing:checkpoint.facing};
  }
  return {x:checkpoint.x,y:checkpoint.y,facing:checkpoint.facing};
}

function saveCheckpoint(){
  if(!player.onGround||dead) return;
  const pb=playerBox();
  if(inSpike(pb)) return;
  checkpoint={x:player.x,y:player.y,facing:player.facing};
}

function respawnPlayer(){
  const spot=findSafeSpawn(player.x);
  player.x=spot.x;
  player.y=spot.y;
  player.facing=spot.facing;
  player.vx=0; player.vy=0;
  player.onGround=true; player.standingOn=null;
  player.crouch=false;
  fx.crash=0; fx.slip=0; fx.smoke=0;
  invulnT=1.6;
  dead=false;
  updateHud();
}

function resetGame(){
  player.x=80; player.y=GROUND-player.h; player.vx=0; player.vy=0;
  player.onGround=true; player.facing=1; player.crouch=false;
  lives=MAX_LIVES; score=0; won=false; dead=false; shakeT=0; splashT=0;
  fx={boost:0,crash:0,slip:0,slipDir:1,dry:0,smoke:0}; T=0; spits=[]; props=[]; spitCd=0;
  passThroughPlat=null; passThroughT=0; coyoteT=0;
  checkpoint={x:80,y:GROUND-player.h,facing:1}; invulnT=0; hasBadge=false; canSpit=false;
  ents.forEach(e=>{
    if(e.type==="coin") e.hidden=false;
    if(e.type==="coffee") e.hidden=false;
    if(e.type==="umbrella") e.hidden=false;
    if(e.type==="banana") e.hidden=false;
    if(e.type==="lozenge") e.hidden=false;
    if(e.type==="sticky"){ e.hidden=false; if(e.initX!==undefined) e.x=e.initX; }
    if(e.type==="badge") e.hidden=false;
    if(e.type==="turnstile"||e.type==="mic"){ e.open=false; e.charge=0; }
    if(e.hideForUnlock) e.hidden=false;
    if(e.unlockGroup) e.hidden=true;
    if(e.type==="enemy"){
      if(e.dead) delete e.dead;
      e.throwCd=e.throwPhase??1.4;
    }
    if(e.type==="box"){ e.x=e.initX??e.x; e.y=e.initY??e.y; e.hidden=false; e.vy=0; e.vx=0; }
    if(e.type==="banana"&&e.initX!==undefined) e.x=e.initX;
    if(e.type==="umbrella"&&e.initX!==undefined) e.x=e.initX;
    if(e.type==="lozenge"&&e.initX!==undefined){ e.x=e.initX; e.y=e.initY??e.y; }
  });
  document.getElementById("overlay").classList.remove("show");
  const spitBanner=document.getElementById("spit_unlock_banner");
  if(spitBanner) spitBanner.classList.remove("show");
  prevLives=lives;
  updateHud();
}

function showSpitUnlockBanner(){

  el.classList.add("show");
  clearTimeout(showSpitUnlockBanner._t);

function pulseAttackKey(){

function getZoneHint(x){

  if(x<1680) return "会议桌会动；隔断要跳桌面；别踩黄色便签。";
  if(x<2280) return "等 @全体 弹窗消失再过去。";
  if(x<2700) return "别碰咖啡；话筒2前停稳或蹲下讲。";
  if(x<3520) return "插话同事贴话筒会打断；口水先清掉。";
  if(x<4660) return "椅子推上桥滑过 400 的缝，当心同事。";

}

function micZone(ts){
  const pad=ts.crouchOnly?68:52;
  return {x:ts.x-pad,y:GROUND-(ts.crouchOnly?86:74),w:ts.w+pad*2,h:ts.crouchOnly?98:84};
}
function micCore(ts){
  return {x:ts.x-4,y:ts.y-2,w:ts.w+8,h:ts.h+8};
}
function inAnyMicZone(){
  const pb=playerBox();
  for(const m of ents){
    if(m.type!=="mic"||m.open) continue;
    if(aabb(pb,micZone(m))) return true;
  }
  return false;
}

function activeMic(){
  const pb=playerBox();
  let best=null, bestD=1e9;
  for(const m of ents){
    if(m.type!=="mic"||m.open) continue;
    if(!aabb(pb,micZone(m))) continue;
    const d=Math.abs(player.x+player.w/2-(m.x+m.w/2));
    if(d<bestD){ bestD=d; best=m; }
  }
  return best;
}

function micAnchored(){
  const mic=activeMic();
  if(!mic||!player.onGround) return false;
  const calm=!keys.left&&!keys.right;
  if(player.crouch||(mic.charge||0)>0.06) return true;
  if(!mic.crouchOnly&&calm) return true;
  return false;
}

    pi.style.display="inline-flex"; pi.className="stat fx boost";
    pi.innerHTML='<span class="lbl">话筒</span>'+pct+'%';
  } else if(fx.boost>0){
    pi.style.display="inline-flex"; pi.className="stat fx boost";
    pi.innerHTML='<span class="lbl">加速</span>'+fx.boost.toFixed(1)+'s';

    pi.style.display="inline-flex"; pi.className="stat fx slip";
    pi.innerHTML='<span class="lbl">打滑</span>'+fx.slip.toFixed(1)+'s';
  } else if(fx.dry>0){
    pi.style.display="inline-flex"; pi.className="stat fx dry";
    pi.innerHTML='<span class="lbl">防湿</span>'+fx.dry.toFixed(0)+'s';
  } else if(fx.smoke>0){
    pi.style.display="inline-flex"; pi.className="stat fx smoke";

  } else if(canSpit){
    pi.style.display="inline-flex"; pi.className="stat fx spit";
    pi.innerHTML='<span class="lbl">口水</span>可用';

}

function doJump(){
  if(!MTUI.isActive()||won||dead) return;
  if(player.crouch) return;
  if(fx.slip>0) return;
  if(!player.onGround && coyoteT<=0) return;
  const boost=fx.boost>0;
  const wet=inPuddle(playerBox())&&fx.dry<=0;
  let j=boost?JUMP_BOOST:JUMP;
  if(wet) j*=0.68;
  player.vy=-j;
  player.onGround=false;
  coyoteT=0;
  sfx.jump();
  spawnDust(player.x+player.w/2, player.y+player.h, 6);
}

function isSpeaking(){
  const mic=activeMic();
  if(mic&&(mic.charge||0)>0.08) return true;
  return ents.some(m=>m.type==="mic"&&m.open&&Math.abs(player.x+player.w/2-(m.x+m.w/2))<140);
}

function spawnSpit(offY, speak, spread){
  const facing=player.facing||1;
  const pb=playerBox();
  const cx=player.x+player.w/2+facing*(14+spread);
  const cy=pb.y+pb.h*0.32+offY;
  spits.push({
    x:cx-6, y:cy-5, w:speak?15:11, h:speak?11:8,
    vx:facing*((speak?540:420)+spread*30), vy:-30-spread*18,
    life:0, max:speak?0.95:0.7, big:speak
  });
}

function doSpit(){
  if(!MTUI.isActive()||won||dead||spitCd>0||fx.slip>0) return;
  if(!canSpit){ MTUI.toast("先拿润喉糖"); return; }
  const speak=isSpeaking();
  spawnSpit(0, speak, 0);
  if(speak) spawnSpit(4, speak, 0.15);
  spitCd=speak?0.34:0.48;
  sfx.spit();
  player.squashT=0.1;
  spawnDust(player.x+player.w/2+(player.facing||1)*10, player.y+player.h*0.4, speak?3:2);
}

function updateSpits(dt){
  spitCd=Math.max(0,spitCd-dt);
  for(const s of spits){
    s.life+=dt;
    s.vy+=1100*dt;
    s.x+=s.vx*dt;
    s.y+=s.vy*dt;
    for(const p of props){
      if(p.life>=p.max||!aabb(s,p)) continue;
      p.life=p.max; score+=8; sfx.clang(); s.life=s.max; break;
    }
    if(s.life>=s.max) continue;
    for(const en of ents){
      if(en.type!=="enemy"||en.dead||!aabb(s,en)) continue;
      en.dead=true;
      score+=s.big?55:40;
      sfx.stomp();
      s.life=s.max;
      spawnDust(en.x+en.w/2,en.y+en.h*0.5,s.big?8:5);
      break;
    }
  }
  spits=spits.filter(s=>s.life<s.max&&s.x>-60&&s.x<WORLD_W+60&&s.y<GROUND+40);
}

function tryEnemyThrow(en){
  if(!en.thrower||en.dead) return;
  en.throwCd=(en.throwCd||0);
  if(en.throwCd>0) return;
  const px=player.x+player.w/2, ex=en.x+en.w/2, dx=px-ex;
  const range=en.throwRange||(en.thrower==="folder"?280:250);
  if(Math.abs(dx)>range||Math.abs(dx)<55) return;
  if(Math.abs(player.y-en.y)>75||player.y>en.y+20) return;
  const kind=en.thrower;
  const dir=dx>0?1:-1;
  props.push({
    kind, x:en.x+en.w/2-(kind==="wok"?14:11), y:en.y+2,
    w:kind==="wok"?28:26, h:kind==="wok"?16:20,
    vx:dir*(kind==="wok"?340:460), vy:kind==="wok"?-300:-160,
    rot:0, life:0, max:2.4, spin:dir*(kind==="wok"?9:5)
  });
  en.throwCd=kind==="wok"?2.5:2.0;
  sfx.throw();
  if(kind==="wok") MTUI.toast("对方向你甩了一口锅");
}

function updateProps(dt){
  const pb=playerBox();
  for(const p of props){
    p.life+=dt;
    p.vy+=GRAV*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.rot=(p.rot||0)+(p.spin||0)*dt;
    if(p.y+p.h>=GROUND-2&&p.vy>0){
      p.y=GROUND-p.h;
      if(p.vy>180){ p.vy=-p.vy*0.32; p.vx*=0.72; sfx.clang(); }
      else{ p.vy=0; p.vx*=0.82; if(p.life>0.35) p.life=p.max-0.05; }
    }
    if(invulnT<=0&&aabb(pb,p)){
      die();
      p.life=p.max;
    }
  }
  props=props.filter(p=>p.life<p.max&&p.x>-100&&p.x<WORLD_W+100&&p.y<GROUND+30);
}

function update(dt){
  if(won) return;
  if(dead) return;
  if(!MTUI.isActive()) return;
  T+=dt;

  if(fx.boost>0){ fx.boost-=dt; if(fx.boost<=0){ fx.boost=0; fx.crash=2.4; updateHud(); } }
  if(fx.crash>0) fx.crash-=dt;
  if(fx.slip>0) fx.slip-=dt;
  if(fx.dry>0) fx.dry-=dt;
  if(fx.smoke>0) fx.smoke-=dt;
  if(invulnT>0) invulnT-=dt;
  if(passThroughT>0) passThroughT-=dt;

  ents.forEach(e=>{ if(e.type==="mover"){
    if(e.baseX===undefined){ e.baseX=e.x; e.prevOff=0; }
    const off=Math.sin(T*e.speed)*e.range, d=off-e.prevOff;
    e.x=e.baseX+off;
    if(player.standingOn===e) player.x+=d;
    e.prevOff=off;
  }});

  ents.forEach(b=>{ if(b.type==="box"&&!b.hidden){
    if(b.slip && Math.abs(b.vx||0)>6){
      const ox=b.x;
      b.x+=b.vx*dt;
      let hit=false;
      for(const o of solids()){
        if(o===b||o.type==="box") continue;
        if(!boxSolidBlocks(b,o)) continue;
        hit=true;
        if(b.vx>0) b.x=o.x-b.w; else b.x=o.x+o.w;
      }
      if(hit){ b.vx=0; sfx.bump(); }
      else if(Math.abs(b.x-ox)>0.5) sfx.push();
      b.vx*=0.94;
      if(Math.abs(b.vx)<8) b.vx=0;
    }
    b.vy=(b.vy||0)+GRAV*dt; b.y+=b.vy*dt;
    solids().forEach(s=>{ if(s!==b&&s.type!=="box"&&aabb(b,s)&&b.vy>=0&&b.y+b.h-b.vy*dt<=s.y+8){ b.y=s.y-b.h; b.vy=0; } });
    if(b.y>GROUND+80 && b.initX!==undefined){ b.x=b.initX; b.y=b.initY??GROUND-52; b.vy=0; b.vx=0; }
  }});

  ents.forEach(en=>{ if(en.type==="enemy"&&!en.dead){
    const spd=en.fast?1.35:1;
    en.x+=en.vx*spd*dt;
    if(en.x<=en.patrol[0]){ en.x=en.patrol[0]; en.vx=Math.abs(en.vx); }
    if(en.x+en.w>=en.patrol[1]){ en.x=en.patrol[1]-en.w; en.vx=-Math.abs(en.vx); }
    if(en.thrower){
      if(en.throwCd>0) en.throwCd-=dt;
      tryEnemyThrow(en);
    }
  }});

  // 插话同事：闯进话筒圈会打断蓄力
  for(const en of ents){
    if(en.type!=="enemy"||en.dead||!en.interrupt) continue;
    for(const ts of ents){
      if(ts.type!=="mic"||ts.open) continue;
      if(!aabb(en,micCore(ts))) continue;
      const before=ts.charge||0;
      ts.charge=Math.max(0,before-dt*2.2);
      if(before>0.12&&ts.charge<0.05) MTUI.toast("有人插话！");
    }
  }

  // 打印机烟雾 / 激光笔
  for(const h of ents){
    if(h.type!=="hazard"||h.hidden) continue;
    const c=h.cycle||4, o=h.activeT||1.5;
    h.active=((T+(h.phase||0))%c)<o;
  }

  player.crouch=keys.down && player.onGround && fx.slip<=0 && (!fx.crash||inAnyMicZone());

  // 浮空平台上按住 ↓ → 穿落下去
  if(keys.down && player.onGround && player.standingOn && isFloatPlat(player.standingOn)){
    passThroughPlat=player.standingOn; passThroughT=0.3;
    player.onGround=false; player.standingOn=null; player.vy=120;
  }

  let dir=(keys.right?1:0)-(keys.left?1:0);
  const pbPre=playerBox();
  const wet=inPuddle(pbPre)&&fx.dry<=0;

  if(fx.slip>0){
    player.vx=fx.slipDir*RUN*0.92;
    if(dir) player.facing=dir;
  } else if(fx.crash>0){
    if(micAnchored()) player.vx=0;
    else player.vx=player.facing*(fx.boost>0?RUN*1.2:RUN);
  } else {
    let spd=((keys.run&&!player.crouch)||fx.boost>0)?RUN:MOVE;
    if(player.crouch) spd*=0.45;
    if(wet) spd*=0.42;
    if(fx.smoke>0) spd*=0.55;
    if(fx.boost>0 && !dir) player.vx=player.facing*spd*0.6;
    else { player.vx=dir*spd; if(dir) player.facing=dir; }
  }

  if(dir&&player.onGround&&!player.crouch){
    player.walkT+=dt; stepTimer-=dt;
    if(stepTimer<=0){
      sfx.step();
      if(wet){ sfx.splash(); splashT=0.12; spawnDust(player.x+player.w/2-dir*6,player.y+player.h,4); }
      else spawnDust(player.x+player.w/2-dir*6,player.y+player.h,2);
      stepTimer=wet?0.28:0.22;
    }
  }

  const pbBefore=playerBox();
  const prevFeetStomp=pbBefore.y+pbBefore.h;
  player.vy+=GRAV*dt;
  moveX(player.vx*dt);
  moveY(player.vy*dt);

  // 捡物
  const pb=playerBox();
  for(const e of ents){
    if(e.type==="coin"&&!e.hidden&&aabb(pb,e)){ e.hidden=true; score+=10; sfx.coin(); MTUI.toast("+10 MT币"); }
    if(e.type==="coffee"&&!e.hidden&&aabb(pb,e)) pickCoffee(e);
    if(e.type==="lozenge"&&!e.hidden&&aabb(pb,e)) pickLozenge(e);
    if(e.type==="umbrella"&&!e.hidden&&aabb(pb,e)) pickUmbrella(e);
    if(e.type==="badge"&&!e.hidden&&aabb(pb,e)) pickBadge(e);
    if(e.type==="banana"&&!e.hidden&&aabb(pb,e)&&(player.onGround||player.vy>80)) stepBanana(e);
    if(e.type==="sticky"&&!e.hidden&&aabb(pb,e)&&player.onGround) stepSticky(e);
  }

  // 敌人
  for(const en of ents){ if(en.type==="enemy"&&!en.dead&&aabb(pb,en)){
    if(invulnT>0) continue;
    if(canStompEnemy(pb,en,player.vy,prevFeetStomp)){
      en.dead=true; player.vy=-420; sfx.stomp(); score+=50;
    } else die();
  }}

  // 烟雾 / 激光笔 / 尖刺 / 掉坑
  for(const h of ents){
    if(h.type!=="hazard"||!h.active) continue;
    if(h.kind==="beam"){
      if(invulnT<=0&&aabb(pb,h)&&!player.crouch) die();
      continue;
    }
    if(aabb(pb,h)){
      fx.smoke=Math.min(2.8,fx.smoke+dt*2.2);
      if(fx.crash<=0&&fx.slip<=0&&player.onGround) player.vx*=0.86;
    }
  }
  if(invulnT<=0){
    for(const e of ents){
      if(e.type!=="spike"||e.hidden) continue;
      if(!aabb(pb,e)) continue;
      // 站在平台（含翻页出现的地面）上时不吃沟伤害
      if(player.onGround&&player.standingOn) continue;
      die();
    }
  }
  if(player.y>VH+60) die();

  // 话筒 / 闸机：蹲或停稳蓄力；翻页解锁平台；咖啡停不住会弹回
  for(const ts of ents){
    if(ts.type!=="turnstile"&&ts.type!=="mic") continue;
    const zone=ts.type==="mic"?micZone(ts):{x:ts.x-24,y:GROUND-64,w:ts.w+48,h:68};
    const inZone=aabb(pb,zone);
    if(!inZone){ ts.charge=Math.max(0,(ts.charge||0)-dt*1.2); continue; }
    const need=ts.type==="mic"?(ts.need||0.82):0.65;
    if((ts.type==="turnstile"&&hasBadge)||ts.open){ ts.open=true; ts.charge=1; if(ts.unlock) revealUnlock(ts.unlock); continue; }
    const still=!ts.crouchOnly&&Math.abs(player.vx)<36&&player.onGround&&!keys.left&&!keys.right;
    const prevCh=ts.charge||0;
    const charging=(player.crouch&&player.onGround)||still;
    if(charging) ts.charge=Math.min(1,(ts.charge||0)+dt*(player.crouch?2.8:2.0));
    else ts.charge=Math.max(0,(ts.charge||0)-dt*(ts.crouchOnly?2.8:2.2));
    if(charging&&micAnchored()) player.vx=0;
    if(prevCh<0.08&&(ts.charge||0)>=0.08&&ts.type==="mic")
      MTUI.toast(ts.crouchOnly?"蹲下讲…":"停稳中…");
    if((ts.charge||0)>=need){
      if(!ts.open && ts.unlock) revealUnlock(ts.unlock);
      ts.open=true;
    }
    if(ts.open) continue;
    const bar={x:ts.x,y:ts.y+8,w:ts.w,h:ts.h-8};
    if(!aabb(pb,bar)) continue;
    // 圈内蓄力时不弹开；须蹲话筒允许先进圈再按 ↓
    if(ts.type==="mic"&&inZone&&((ts.charge||0)>0.03||player.crouch||still||ts.crouchOnly)) continue;
    if(fx.crash>0){ stopCrash(); player.vx=-player.facing*RUN*0.85; sfx.bump(); break; }
    player.vx=0;
    if(player.facing>0) player.x=ts.x-pb.w+(player.x-pb.x);
    else player.x=ts.x+ts.w+(player.x-pb.x);
    sfx.bump(); break;
  }

  // 低门：仅横杠判定；站着撞门弹回，蹲下可钻过
  for(const g of ents){
    if(g.type!=="gate") continue;
    const bar=gateBar(g);
    if(!aabb(pb,bar)) continue;
    if(player.crouch) continue;
    if(fx.crash>0){ stopCrash(); break; }
    player.vx=0;
    if(player.facing>0) player.x=g.x-pb.w+(player.x-pb.x);
    else player.x=g.x+g.w+(player.x-pb.x);
    sfx.bump();
    break;
  }

  // Goal
  for(const g of ents){ if(g.type==="goal"&&aabb(pb,g)) win(); }

  // 相机
  const target=player.x-VW*0.32;
  camX+=(target-camX)*Math.min(1,dt*8);
  camX=Math.max(0,Math.min(WORLD_W-VW,camX));

  updateSpits(dt);
  updateProps(dt);
  for(const pt of particles){ pt.life+=dt; pt.vy+=900*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; }
  particles=particles.filter(pt=>pt.life<pt.max);
  if(splashT>0) splashT=Math.max(0,splashT-dt);
  if(player.squashT>0) player.squashT=Math.max(0,player.squashT-dt);
  if(!player.onGround) coyoteT=Math.max(0,coyoteT-dt);
  saveCheckpoint();
  syncMicUnlocks();
  if(T>0) ents.forEach(e=>{ if(e.revealT>0) e.revealT-=dt; });
  updateHud();
}

function moveX(dx){
  if(!dx){ return; }
  const ox=player.x;
  player.x+=dx;
  const pb=playerBox();
  let blocked=false;
  for(const s of solids()){
    if(!solidBlocksX(pb,s)) continue;
    blocked=true;
    const off=player.x-pb.x;
    if(s.type==="box"){
      const pen=dx>0?(pb.x+pb.w)-s.x:pb.x-(s.x+s.w);
      s.x+=pen; let boxBlocked=false, mounted=false;
      for(const o of solids()){
        if(o===s||o.type==="box") continue;
        if(!boxSolidBlocks(s,o)) continue;
        if(dx>0&&tryMountBox(s,o,pen)){ mounted=true; break; }
        boxBlocked=true; break;
      }
      if(boxBlocked) s.x-=pen;
      else{
        if(dx) sfx.push();
        if(s.slip && Math.abs(pen)>0.5){
          s.vx=(s.vx||0)+pen*3.5;
          if(Math.abs(s.vx)>200) s.vx=Math.sign(s.vx)*200;
        }
      }
      if(dx>0) player.x=s.x-pb.w+off; else player.x=s.x+s.w+off;
    } else {
      if(dx>0) player.x=s.x-pb.w+off; else player.x=s.x+s.w+off;
    }
  }
  const beforeClamp=player.x;
  player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));
  if(fx.crash>0){
    const moved=Math.abs(player.x-ox), want=Math.abs(dx);
    if(blocked || beforeClamp!==player.x || (want>0.5 && moved<want*0.35)) stopCrash();
  }
  if(fx.slip>0 && blocked){ fx.slip=0; player.vx=0; sfx.bump(); updateHud(); }
}

function moveY(dy){
  const prevPb=playerBox();
  const prevFeet=prevPb.y+prevPb.h;
  player.y+=dy;
  const was=player.onGround;
  player.onGround=false; player.standingOn=null;
  const pb=playerBox();

  for(const s of solids()){
    if(!solidBlocksY(pb,s,dy,prevFeet)) continue;
    if(dy>0){
      player.y=s.y-player.h; player.vy=0; player.onGround=true; player.standingOn=s;
      if(fx.crash>0 && !was) stopCrash();   // 空中落地才刹停
    } else if(dy<0){
      player.y=s.y+s.h-(pb.y-player.y)-pb.h; player.vy=0;
      if(fx.crash>0) stopCrash();            // 顶到天花板
    }
  }
  if(player.onGround&&!was){ sfx.land(); player.squashT=0.15; spawnDust(player.x+player.w/2,player.y+player.h,8); }
  if(player.onGround) coyoteT=0.1;
}

/* ===== 绘制 ===== */
let _seed=1;
function srand(s){ _seed=s>>>0; }
function rnd(){ _seed=(_seed*1664525+1013904223)>>>0; return _seed/4294967296; }
function jit(a){ return (rnd()-0.5)*a; }
function rline(x1,y1,x2,y2){ const mx=(x1+x2)/2+jit(3),my=(y1+y2)/2+jit(3);
  ctx.beginPath(); ctx.moveTo(x1+jit(1),y1+jit(1)); ctx.quadraticCurveTo(mx,my,x2+jit(1),y2+jit(1)); ctx.stroke(); }
function rrect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }

function fillStroke(){ ctx.fill(); ctx.stroke(); }

function drawCoffee(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*5)*2.5;
  const y=e.y+bob;

  // 文案「咖啡」
  ctx.fillStyle="#fff9f0"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(cx-24,y,48,20,5); fillStroke();
  ctx.fillStyle=INK; ctx.font="800 13px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("咖啡",cx,y+14); ctx.textAlign="left";

  // 杯身
  const cupTop=y+24, cupW=22, cupH=22;
  ctx.fillStyle="#d4a574"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(cx,cupTop,10,Math.PI,0); ctx.stroke();
  ctx.fillStyle="#b87d4b";
  rrect(cx-cupW/2,cupTop,cupW,cupH,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#f5e6d3"; ctx.fillRect(cx-cupW/2+3,cupTop+4,cupW-6,8);

  // 热气
  ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.globalAlpha=0.45;
  rline(cx-4,cupTop-2,cx-6,cupTop-10); rline(cx,cupTop-4,cx,cupTop-14); rline(cx+4,cupTop-2,cx+6,cupTop-10);
  ctx.globalAlpha=1;
}

function drawLozenge(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*4)*2, y=e.y+bob;
  ctx.fillStyle="#fff6e8"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  rrect(cx-16,y+8,32,24,5); fillStroke();
  ctx.fillStyle="#e8b84a"; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
  rrect(cx-11,y+14,22,12,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#7ec87a"; ctx.beginPath(); ctx.arc(cx-5,y+20,3,0,7); ctx.arc(cx+5,y+20,3,0,7); ctx.fill();
  ctx.fillStyle=INK; ctx.font="700 9px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("润喉糖",cx,y+8); ctx.textAlign="left";
}

function drawBanana(e){
  const cx=e.x+e.w/2, cy=e.y+e.h/2;
  ctx.fillStyle="#ffe566"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-14,cy+2); ctx.quadraticCurveTo(cx,cy-8,cx+14,cy+2);
  ctx.quadraticCurveTo(cx+4,cy+6,cx-14,cy+2); ctx.closePath(); fillStroke();
  ctx.strokeStyle="rgba(37,37,37,.35)"; ctx.lineWidth=1.5;
  rline(cx-6,cy-2,cx+2,cy+1);
}

function drawPuddle(e){
  const cx=e.x+e.w/2, cy=e.y+e.h/2+2, rx=e.w/2, ry=5+Math.sin(T*4+cx)*0.8;
  ctx.fillStyle="rgba(100,165,210,.35)"; ctx.strokeStyle="rgba(42,42,42,.25)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1;
  rline(cx-rx*0.5,cy-1,cx-rx*0.2,cy-2); rline(cx+rx*0.15,cy,cx+rx*0.45,cy-1);
}

function drawBadge(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*4)*2;
  ctx.fillStyle="#fff"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  rrect(cx-14,e.y+bob,28,36,4); fillStroke();
  ctx.fillStyle=INK; ctx.font="800 9px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("工牌",cx,e.y+bob+22); ctx.textAlign="left";
  ctx.strokeStyle=INK; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,e.y+bob+36); ctx.lineTo(cx,e.y+bob+44); ctx.stroke();
}

function drawTurnstile(e){
  const cx=e.x+e.w/2, open=e.open||hasBadge;
  const pct=open?1:Math.min(1,e.charge||0);
  ctx.fillStyle="#d0cdc6"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(e.x,e.y+8,e.w,e.h-8,3); fillStroke();
  ctx.fillStyle=open?"#7ec87a":"#c9956a";
  rrect(e.x+4,e.y+e.h-14,e.w-8,6,2); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=3;
  const ang=open?Math.PI/2:Math.PI/2*(1-pct);
  ctx.save(); ctx.translate(cx,e.y+e.h-4); ctx.rotate(ang);
  rline(-18,0,18,0); ctx.restore();
  ctx.save(); ctx.translate(cx,e.y+e.h-4); ctx.rotate(-ang);
  rline(-18,0,18,0); ctx.restore();
  if(!open && pct>0.05){
    ctx.fillStyle="rgba(37,37,37,.55)"; ctx.font="600 9px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("停",cx,e.y+22); ctx.textAlign="left";
  }
}

function drawMic(e){
  const cx=e.x+e.w/2, open=e.open;
  const need=e.need||0.82;
  const pct=open?1:Math.min(1,(e.charge||0)/need);
  ctx.fillStyle="#3a3a3a"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(e.x+10,e.y+4,e.w-20,e.h-28,4); fillStroke();
  ctx.fillStyle="#888"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,e.y+e.h-18,14,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=open?"#7ec87a":"#c9956a";
  rrect(e.x+6,e.y+e.h-10,e.w-12,5,2); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  const glow=open?0.35:0.15+pct*0.2;
  ctx.fillStyle=`rgba(126,200,122,${glow})`;
  ctx.beginPath(); ctx.arc(cx,e.y+16,8+pct*4,0,7); ctx.fill();
  ctx.fillStyle=INK; ctx.font="700 10px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("话筒",cx,e.y+20);
  ctx.font="600 9px PingFang SC,sans-serif";
  ctx.fillText("P"+(e.slide||1),cx,e.y+e.h-22);
  if(!open && pct>0.04){
    ctx.fillStyle="rgba(37,37,37,.6)"; ctx.font="600 9px PingFang SC,sans-serif";
    ctx.fillText(e.crouchOnly?"蹲":(pct>0.2?"停":"…"),cx,e.y+34);
  }
  ctx.textAlign="left";
}

function drawProjector(e){
  ctx.fillStyle="#fff"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(e.x,e.y+18,e.w,e.h-18,5); fillStroke();
  ctx.fillStyle="#ddd"; ctx.fillRect(e.x+12,e.y+32,e.w-24,20);
  const lens=e.x+e.w-8;
  ctx.fillStyle="#4a6a8a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(lens,e.y+42,10,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle=INK; ctx.font="700 10px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("投影",e.x+e.w/2,e.y+14); ctx.textAlign="left";
}

function drawPpt(e){
  let slide=0;
  for(const m of ents) if(m.type==="mic"&&m.open) slide=Math.max(slide,m.slide||0);
  ctx.fillStyle="#f8f6f0"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(e.x,e.y,e.w,e.h,6); fillStroke();
  ctx.fillStyle=slide>0?"#fff":"#ece8e0";
  rrect(e.x+10,e.y+12,e.w-20,e.h-28,4); ctx.fill();
  ctx.strokeStyle="rgba(37,37,37,.15)"; ctx.lineWidth=1.5;
  if(slide>0){
    ctx.fillStyle=INK; ctx.font="700 11px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("第 "+slide+" 页",e.x+e.w/2,e.y+e.h/2+4);
    ctx.textAlign="left";
  } else {
    rline(e.x+24,e.y+e.h/2,e.x+e.w-24,e.y+e.h/2);
    ctx.fillStyle="rgba(37,37,37,.35)"; ctx.font="600 10px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("待翻页",e.x+e.w/2,e.y+e.h/2+4); ctx.textAlign="left";
  }
  ctx.strokeStyle=INK;
}

function drawSlippers(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*4)*2, y=e.y+bob;
  ctx.fillStyle="#7aabcc"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(cx-8,y+36,10,5,0,0,7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx+8,y+36,10,5,0,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=INK; ctx.lineWidth=2;
  rline(cx-8,y+32,cx-8,y+24); rline(cx+8,y+32,cx+8,y+24);
  ctx.fillStyle=INK; ctx.font="700 10px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("拖鞋",cx,y+14); ctx.textAlign="left";
}
function drawUmbrella(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*4)*2, y=e.y+bob;
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineCap="round";
  rline(cx,y+38,cx,y+52);
  ctx.fillStyle="#e85d5d"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,y+22,18,Math.PI,0); ctx.closePath(); fillStroke();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx,y+22,6,0,7); ctx.fill();
  ctx.fillStyle=INK; ctx.font="700 11px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("伞",cx,y+14); ctx.textAlign="left";
}

function drawPrinter(e){
  ctx.fillStyle="#fff"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(e.x,e.y,e.w,e.h,5); fillStroke();
  ctx.fillStyle=INK; ctx.fillRect(e.x+10,e.y+12,e.w-20,8);
  ctx.fillStyle="#ddd"; ctx.fillRect(e.x+14,e.y+28,e.w-28,22);
  const puff=((T*2.2|0)%3);
  if(puff>0){
    ctx.fillStyle="rgba(180,180,175,.35)"; ctx.strokeStyle="rgba(37,37,37,.15)"; ctx.lineWidth=1.5;
    for(let i=0;i<puff;i++){
      const px=e.x+e.w+8+i*14, py=e.y+18-i*6+Math.sin(T*6+i)*3;
      ctx.beginPath(); ctx.arc(px,py,8+i*2,0,7); ctx.fill(); ctx.stroke();
    }
  }
  ctx.fillStyle=INK; ctx.font="700 10px PingFang SC,sans-serif"; ctx.textAlign="center";

const sprites={idle:null,jump:null,run:null};
const enemySprites={walk:null};
function makeSprite(img){
  const max=340, scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.drawImage(img,0,0,w,h);
  const id=g.getImageData(0,0,w,h), d=id.data;            // file:// 下可能抛安全错误 → 由 onload 捕获
  const isBg=i=> d[i]>175&&d[i+1]>175&&d[i+2]>175;
  const vis=new Uint8Array(w*h), st=[];
  const push=(x,y)=>{ if(x<0||y<0||x>=w||y>=h)return; const p=y*w+x; if(vis[p])return; if(!isBg(p*4))return; vis[p]=1; st.push(p); };
  for(let x=0;x<w;x++){push(x,0);push(x,h-1);} for(let y=0;y<h;y++){push(0,y);push(w-1,y);}
  while(st.length){ const p=st.pop(),x=p%w,y=(p/w)|0; d[p*4+3]=0; push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1); }
  g.putImageData(id,0,0);
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3]>10){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
  if(maxX<minX) return c;
  const tw=maxX-minX+1, th=maxY-minY+1;
  const t=document.createElement('canvas'); t.width=tw; t.height=th;
  t.getContext('2d').drawImage(c,minX,minY,tw,th,0,0,tw,th);
  return t;
}
function loadSprite(src,key,bucket=sprites){
  const img=new Image();
  img.onload=()=>{ try{ bucket[key]=makeSprite(img); }catch(e){ bucket[key]=img; } };
  img.onerror=()=>{ console.warn('[sprite] 加载失败:', src); };
  img.src=src;
}

function drawEnemyVector(e,facing){
  const walk=Math.sin(T*10+ e.x*0.02);
  const BLK=INK;
  ctx.save();
  ctx.translate(e.x+e.w/2,e.y+e.h);
  if(facing<0) ctx.scale(-1,1);
  ctx.lineCap="round"; ctx.lineJoin="round";
  // 腿
  ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-5,-12); ctx.lineTo(-5-walk*4,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5-walk*4,0); ctx.lineTo(-5-walk*4+facing*5,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-12); ctx.lineTo(5+walk*4,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5+walk*4,0); ctx.lineTo(5+walk*4+facing*5,0); ctx.stroke();
  // 身体（比 Zack 瘦一点、浅色衫）
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-8,-36); ctx.quadraticCurveTo(-10,-24,-7,-12);
  ctx.lineTo(7,-12); ctx.quadraticCurveTo(10,-24,8,-36); ctx.closePath(); fillStroke();
  // 通勤包
  ctx.fillStyle="#e8dfd3"; ctx.strokeStyle=BLK; ctx.lineWidth=1.8;
  ctx.strokeRect(6,-28,7,10); ctx.fillRect(6,-28,7,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,-28); ctx.lineTo(9,-32); ctx.stroke();
  // 手臂
  ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-7,-30); ctx.lineTo(-11,-22+walk*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7,-30); ctx.lineTo(12,-24-walk*2); ctx.stroke();
  // 头
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,-40,9,0,7); ctx.fill(); ctx.stroke();
  // 脸（无眼镜，和 Zack 区分）
  ctx.fillStyle=BLK;
  ctx.beginPath(); ctx.arc(-3,-41,1.5,0,7); ctx.arc(3,-41,1.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3,-36); ctx.quadraticCurveTo(0,-35,3,-36); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e){
  const facing=e.vx>=0?1:-1;
  const spr=enemySprites.walk;
  const cx=e.x+e.w/2, foot=e.y+e.h;
  const bob=Math.sin(T*10+e.x*0.02)*1.5;
  if(spr){
    ctx.save();
    ctx.translate(cx,foot+bob);
    if(facing<0) ctx.scale(-1,1);
    const dh=e.h+4, dw=dh*(spr.width/spr.height);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(spr,-dw/2,-dh,dw,dh);
    ctx.restore();
  } else {
    drawEnemyVector(e,facing);
  }
}

function drawPlayer(){
  const p=player; const cx=p.x+p.w/2-camX, footY=p.y+p.h;
  const air=!p.onGround, moving=keys.left||keys.right||Math.abs(p.vx)>30;
  // 挤压拉伸形变（以脚底为锚点）
  let sx=1, sy=1;
  if(p.squashT>0){ const k=p.squashT/0.18; sy=1-0.30*k; sx=1+0.30*k; }
  else if(p.crouch&&p.onGround){ sy=0.58; sx=1.08; }
  else if(air){ const st=Math.max(0,Math.min(0.34,Math.abs(p.vy)/3000)); sy=1+st; sx=1-st*0.55; }
  // 按动作选贴图
  let spr;
  if(air) spr=sprites.jump||sprites.idle;
  else if(moving&&!p.crouch) spr=sprites.run||sprites.idle;
  else spr=sprites.idle;
  ctx.save();
  if(invulnT>0 && Math.sin(T*24)>0) ctx.globalAlpha=0.45;
  ctx.translate(cx, footY);
  ctx.scale(sx, sy);
  if(dead) ctx.rotate(p.facing*1.25);
  else if(fx.slip>0) ctx.rotate(Math.sin(T*28)*0.38*(p.facing||1));
  else if(air) ctx.rotate(Math.max(-0.2,Math.min(0.22, p.vy/3800))*(p.facing||1));
  if(spr){
    const dh=80, dw=dh*(spr.width/spr.height);
    if(p.facing<0) ctx.scale(-1,1);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(spr, -dw/2, -dh, dw, dh);
  } else {
    drawGuyVector(p);   // 没有贴图时回退到矢量绘制
  }
  ctx.restore();
}

function drawGuyVector(p){
  const walking = p.onGround && (keys.left||keys.right);
  const walk = walking ? Math.sin(p.walkT*12) : 0;
  const air = !p.onGround;
  const BLK="#1c1c1c";
  ctx.lineJoin="round"; ctx.lineCap="round";

  // 腿 + 带方向的小脚
  ctx.strokeStyle=BLK; ctx.lineWidth=4.5;
  const lA = air ? 3 : (5 + walk*5);
  const lB = air ? 3 : (5 - walk*5);
  ctx.beginPath(); ctx.moveTo(-6,-13); ctx.lineTo(-6-lA*0.5,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6-lA*0.5,0); ctx.lineTo(-6-lA*0.5+p.facing*6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,-13);  ctx.lineTo(6+lB*0.5,-1);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6+lB*0.5,0);  ctx.lineTo(6+lB*0.5+p.facing*6,0); ctx.stroke();

  // 身体（黑衬衫，圆胖）
  const bTop=-37, bBot=-12;
  ctx.fillStyle=BLK; ctx.strokeStyle=BLK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-9,bTop);
  ctx.bezierCurveTo(-22,bTop+5,-21,bBot-3,-15,bBot);
  ctx.quadraticCurveTo(0,bBot+7,15,bBot);
  ctx.bezierCurveTo(21,bBot-3,22,bTop+5,9,bTop);
  ctx.closePath(); ctx.fill();

  // 手臂（黑粗线，圆头手；空中上扬 / 走路前后摆）
  ctx.strokeStyle=BLK; ctx.lineWidth=5;
  const armS = air ? -9 : walk*3;
  ctx.beginPath(); ctx.moveTo(-13,bTop+6); ctx.quadraticCurveTo(-23,bTop+16,-22,bTop+27+armS); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13,bTop+6);  ctx.quadraticCurveTo(23,bTop+16,22,bTop+27-armS);  ctx.stroke();

  // 工牌
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=1.2;
  rrect(-8,bTop-10,16,8,2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=BLK; ctx.font="bold 5px sans-serif"; ctx.textAlign="center";
  ctx.fillText("CEO",0,bTop-4); ctx.textAlign="left";
  ctx.strokeStyle="#fff"; ctx.fillStyle="#fff"; ctx.lineWidth=1.7;
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(1,bBot+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(-9,bTop+1); ctx.lineTo(-3,bTop+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(11,bTop+1); ctx.lineTo(5,bTop+10); ctx.stroke();
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(1,bTop+14+i*6,1.4,0,7); ctx.fill(); }

  // 头（白 黑边）
  const hY=-50, hR=13;
  ctx.fillStyle="#fdfdfd"; ctx.strokeStyle=BLK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,hY,hR,0,7); ctx.fill(); ctx.stroke();

  // 寸头发茬（只在左半边到头顶，右边是光的；随朝向镜像）
  ctx.lineWidth=1.7;
  for(let a=-Math.PI*1.02; a<=-Math.PI*0.32; a+=Math.PI*0.052){
    const ang = p.facing>=0 ? a : (-Math.PI - a);
    const hx=Math.cos(ang)*hR, hy=hY+Math.sin(ang)*hR;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ang)*6, hy+Math.sin(ang)*6); ctx.stroke();
  }

  const fx=p.facing*2;
  if(dead){
    ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(fx-9,hY-3); ctx.lineTo(fx-3,hY+3); ctx.moveTo(fx-3,hY-3); ctx.lineTo(fx-9,hY+3);
    ctx.moveTo(fx+3,hY-3); ctx.lineTo(fx+9,hY+3); ctx.moveTo(fx+9,hY-3); ctx.lineTo(fx+3,hY+3); ctx.stroke();
  } else {
    // 黑框方形眼镜
    function lens(cxL){ const w=11,h=8,r=2.5,x=fx+cxL-w/2,y=hY-1-h/2;
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); }
    ctx.fillStyle="#fdfdfd"; ctx.strokeStyle=BLK; ctx.lineWidth=2.3;
    lens(-6); ctx.fill(); ctx.stroke();
    lens(7);  ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx-0.5,hY-1); ctx.lineTo(fx+1.5,hY-1); ctx.stroke();      // 横梁
    ctx.beginPath(); ctx.moveTo(fx-11.5,hY-2); ctx.lineTo(fx-15,hY-4); ctx.stroke();      // 镜腿
    // 眼睛（大黑点）
    ctx.fillStyle=BLK;
    ctx.beginPath(); ctx.arc(fx-6,hY-1,2.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+7,hY-1,2.6,0,7); ctx.fill();
    // 嘴（略撇的平嘴）
    ctx.strokeStyle=BLK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-5,hY+9); ctx.quadraticCurveTo(fx,hY+7,fx+5,hY+9); ctx.stroke();
  }
}
function drawSticky(e){
  ctx.fillStyle="#fff6a8"; ctx.strokeStyle=INK; ctx.lineWidth=1.8;
  rrect(e.x,e.y,e.w,e.h,2); fillStroke();
  ctx.strokeStyle="rgba(37,37,37,.25)"; ctx.lineWidth=1;
  rline(e.x+6,e.y+4,e.x+e.w-6,e.y+4);
  rline(e.x+6,e.y+8,e.x+e.w-10,e.y+8);
  ctx.fillStyle="rgba(37,37,37,.45)"; ctx.font="600 8px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("改",e.x+e.w/2,e.y+e.h-2); ctx.textAlign="left";
}

function drawProp(p){
  ctx.save();
  ctx.translate(p.x+p.w/2,p.y+p.h/2);
  ctx.rotate(p.rot||0);
  if(p.kind==="wok"){
    ctx.fillStyle="#5a5a5a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,2,p.w/2,p.h/2.2,0,0,7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle="#888"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.w*0.22,-2); ctx.lineTo(p.w*0.42,-5); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.2)";
    ctx.beginPath(); ctx.ellipse(-3,0,p.w*0.18,p.h*0.22,0,0,7); ctx.fill();
  } else {
    ctx.fillStyle="#f4e8c8"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    rrect(-p.w/2,-p.h/2,p.w,p.h,2); fillStroke();
    ctx.strokeStyle="rgba(37,37,37,.2)"; ctx.lineWidth=1;
    rline(-p.w/2+4,-p.h/2+5,p.w/2-4,-p.h/2+5);
    rline(-p.w/2+4,-p.h/2+10,p.w/2-8,-p.h/2+10);
    ctx.fillStyle="#e85d5d"; ctx.font="700 9px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("急",0,4); ctx.textAlign="left";
  }
  ctx.restore();
}

function drawProps(){
  ctx.save(); ctx.translate(-camX,0);
  for(const p of props) drawProp(p);
  ctx.restore();
}

function drawSpits(){
  ctx.save(); ctx.translate(-camX,0);
  for(const s of spits){
    const t=s.life/s.max;
    ctx.globalAlpha=Math.max(0.25,1-t*0.75);
    ctx.fillStyle=s.big?"#8ec8e8":"#a8d8f0";
    ctx.strokeStyle="rgba(37,37,37,.35)"; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.ellipse(s.x+s.w/2,s.y+s.h/2,s.w/2,s.h/2,0,0,7);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.45)";
    ctx.beginPath();
    ctx.arc(s.x+s.w*0.35,s.y+s.h*0.35,Math.max(1.2,s.w*0.12),0,7);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles(){
  for(const pt of particles){
    const a=Math.max(0,1-pt.life/pt.max);
    ctx.globalAlpha=a*0.55; ctx.fillStyle=pt.col||"#888";
    ctx.beginPath(); ctx.arc(pt.x-camX,pt.y,pt.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.save();
  if(shakeT>0){ shakeT-=0.016; ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6); }
  drawBackground(); drawWorld(); drawProps(); drawSpits(); drawParticles(); drawPlayer(); drawFog();
  ctx.restore();
}

let last=0;
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000||0); last=t;
  if(MTUI.isActive()) update(dt);
  render();
  MTUI.syncKeys(keys);
  requestAnimationFrame(loop);
}

/* ===== 输入 & UI ===== */
MTUI.bindKeys(keys, doJump, ensureAudio, doSpit);
MTProgress.guardLevel(3);
MTUI.init({
  levelId: 3,
  levelTag:"关卡3",
  homeUrl:"../index.html",
  defaultHint:"秘书：先拿润喉糖，再清插话。",
  startTitle:"会议室",
  startBody:"秘书在等候区放了润喉糖。<br>跳上去拿到后，<kbd>X</kbd> 才能吐口水清插话。<br><kbd>Esc</kbd> 暂停",
  startBtn:"进去讲",
  ensureAudio,
  toggleSound(){ soundOn=!soundOn; return soundOn; },
  isTerminal(){ return won||lives<=0; },
  onBeforeStart(){ resetGame(); },
  onRetry(){ resetGame(); },
  onInit(){ resetGame(); }
});
requestAnimationFrame(loop);
</script>
