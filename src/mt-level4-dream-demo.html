  .game-footer{background:var(--paper);border-top:2px solid var(--ink);padding:12px 14px 10px;}

/* ===== 音效 ===== */
let actx=null, soundOn=true;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==="suspended") actx.resume();
  if(window.MTBGM) MTBGM.attach(actx); }
function tone(f,dur,type="square",vol=0.18,slideTo=null){
  if(!actx||!soundOn) return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}
const sfx={

  land:()=>tone(150,0.06,"square",0.1),
  step:()=>tone(210,0.03,"square",0.04),
  push:()=>tone(110,0.08,"sawtooth",0.08,90),
  pickup:()=>{tone(700,0.08,"square",0.16);setTimeout(()=>tone(1050,0.12,"square",0.16),70);},

  stomp:()=>tone(200,0.1,"square",0.15,80),

/* ===== 隐藏关 · 年终奖房 ===== */
const BONUS_TIME=20;

let bonusCoins=[], bonusPlatforms=[];
let mainSnapshot=null, bonusTrayPause=0;

const MOVE=300, RUN=480, GRAV=2200, JUMP=820, JUMP_BOOST=960;
// 跑跳水平极限 ≈352px（dt=1/60 模拟）；推箱沟宽 >352 且不推过不去
const JUMP_RUN_X=352;
let stepTimer=0;

function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function isFloatPlat(s){ return s.type==="platform"&&!s.ground; }
function isUpperPlat(s){ return isFloatPlat(s)&&s.route==="upper"; }
function trayBlocksUpper(){ return fx.tray>0&&!trayDelivered&&!isDreamActive(); }
function platBlocksX(pb,s){
  if(trayBlocksUpper()&&isUpperPlat(s)) return false;
  if(s===passThroughPlat&&passThroughT>0) return false;
  if(!isFloatPlat(s)||!aabb(pb,s)) return false;
  if(fx.crash>0) return true;           // 停不住时碰到平台就挡
  if(pb.y>=s.y+s.h-2) return false;     // 下蹲时身体低于平台底边 → 可钻过去
  if(player.y+player.h<=s.y+4) return false;
  return true;
}
function platBlocksY(pb,s,dy,prevFeet){
  if(trayBlocksUpper()&&isUpperPlat(s)) return false;
  if(s===passThroughPlat&&passThroughT>0) return false;
  if(!isFloatPlat(s)||!aabb(pb,s)) return false;
  if(dy>0) return prevFeet<=s.y+6;   // 仅能从上方落下
  return false;                       // 从下方穿过，不顶头
}
function solidBlocksX(pb,s){
  if(s.type==="door") return !isDoorOpen(s)&&aabb(pb,s);
  if(s.type==="box"||s.type==="mover") return aabb(pb,s);
  if(isFloatPlat(s)) return platBlocksX(pb,s);
  return aabb(pb,s);
}
function solidBlocksY(pb,s,dy,prevFeet){
  if(s.type==="door") return !isDoorOpen(s)&&aabb(pb,s);
  if(s.type==="box"||s.type==="mover") return aabb(pb,s);
  if(isFloatPlat(s)) return platBlocksY(pb,s,dy,prevFeet);
  return aabb(pb,s);
}
function isDoorOpen(d){
  const c=d.cycle||4, o=d.openT||1;
  return ((T+(d.phase||0))%c)<o;
}
function solids(){
  if(gameMode==="bonus"){
    return bonusPlatforms.filter(e=>e.type==="platform"&&!e.hidden);
  }
  return ents.filter(e=>{
    if(e.type==="platform"&&!e.hidden){
      if(e.route==="trayCeiling") return trayBlocksUpper();
      return true;
    }
    return e.type==="box"||e.type==="mover"||(e.type==="door"&&!isDoorOpen(e));
  });
}
function gateBar(g){ return {x:g.x, y:g.y, w:g.w, h:12}; }

function playerBox(){
  const c=player.crouch && player.onGround;
  return {x:player.x+(c?6:0), y:player.y+(c?20:0), w:player.w-(c?12:0), h:player.h-(c?20:0)};
}
function canStompEnemy(pb,en,vy,prevFeet){
  if(vy<=80) return false;
  const feet=pb.y+pb.h;
  if(feet>en.y+16||prevFeet>en.y+8) return false;
  return pb.x+pb.w>en.x+6&&pb.x<en.x+en.w-6;
}

function inPuddle(pb){
  for(const e of ents) if(e.type==="puddle"&&!e.hidden&&aabb(pb,e)) return true;
  return false;
}

function inSpike(pb){
  for(const e of ents) if(e.type==="spike"&&!e.hidden&&aabb(pb,e)) return true;
  return false;
}

function findSafeSpawn(preferX){
  const w=player.w, h=player.h;
  const cands=[];
  for(const s of solids()){
    if(s.hidden) continue;
    const left=Math.max(preferX,s.x), right=Math.min(preferX+w,s.x+s.w);
    if(right<=left) continue;
    const x=Math.max(0,Math.min(WORLD_W-w,left));
    const y=s.y-h;
    if(!inSpike({x,y,w,h})) cands.push({x,y,sy:s.y});
  }
  if(cands.length){
    cands.sort((a,b)=>b.sy-a.sy);
    return {x:cands[0].x,y:cands[0].y,facing:checkpoint.facing};
  }
  return {x:checkpoint.x,y:checkpoint.y,facing:checkpoint.facing};
}

function updateBonus(dt){
  bonusTimeLeft-=dt;
  if(bonusTimeLeft<=0){ exitBonusRoom(true); return; }

  player.crouch=keys.down&&player.onGround;
  let dir=(keys.right?1:0)-(keys.left?1:0);
  let spd=(keys.run&&!player.crouch)?RUN:MOVE;
  if(player.crouch) spd*=0.45;
  player.vx=dir*spd;
  if(dir) player.facing=dir;

  if(dir&&player.onGround&&!player.crouch){
    player.walkT+=dt;
    stepTimer-=dt;
    if(stepTimer<=0){ sfx.step(); spawnDust(player.x+player.w/2-dir*6,player.y+player.h,2); stepTimer=0.22; }
  }

  player.vy+=GRAV*dt;
  moveX(player.vx*dt);
  moveY(player.vy*dt);
  const pb=playerBox();

  for(const c of bonusCoins){
    if(c.hidden) continue;
    if(aabb(pb,c)){
      c.hidden=true;
      bonusRoundScore+=c.val;
      score+=c.val;
      sfx.coin();
      if(c.val>=50) MTUI.toast(`+${c.val} MT币！`);
    }
  }

  if(player.x+player.w>860&&player.onGround&&keys.right){
    exitBonusRoom(false);
    return;
  }

  camX=0;
  updateBonusHud();
}

function isDreamActive(){ return dream.active>0; }
function canStartDream(){ return MTUI.isActive()&&!won&&!dead&&gameMode==="main"&&dream.active<=0&&dream.cooldown<=0; }
function syncDreamHud(){
  const root=document.getElementById("ui_dream");
  const fill=document.getElementById("ui_dream_fill");
  const label=document.getElementById("ui_dream_label");
  const btn=document.getElementById("btn_dream");
  if(!root||!fill||!label||!btn) return;
  let pct=1;
  if(dream.active>0) pct=dream.active/DREAM_DURATION;
  else if(dream.cooldown>0) pct=1-(dream.cooldown/DREAM_COOLDOWN);
  fill.style.width=Math.max(0,Math.min(1,pct))*100+"%";
  label.textContent=dream.active>0?"让路":(dream.cooldown>0?dream.cooldown.toFixed(0)+"s":"做梦");
  btn.disabled=!canStartDream();
  root.classList.toggle("fx", dream.active>0);
  root.classList.toggle("dream", dream.active>0);
}
function startDream(){
  ensureAudio();
  if(!canStartDream()) return;
  summonDreamTray();
  dream.active=DREAM_DURATION;
  fx.smoke=0;
  MTUI.toast("做梦模式：全员让路");
  sfx.pickup();
  updateHud();
}
function updateDream(dt){
  if(dream.active>0){
    dream.active=Math.max(0,dream.active-dt);
    if(dream.active<=0){ dream.cooldown=DREAM_COOLDOWN; MTUI.toast("梦醒了，食堂恢复拥挤", 1200); }
  } else if(dream.cooldown>0) dream.cooldown=Math.max(0,dream.cooldown-dt);
}

function summonDreamTray(){
  if(trayDelivered||fx.tray>0) return true;
  if(!isFoodServed()){
    MTUI.toast("窗口还没出餐，稍后再召唤餐盘");
    return false;
  }
  const t=ents.find(e=>e.type==="tray");
  if(t) t.hidden=true;
  fx.tray=TRAY_TIME;
  spawnDust(player.x+player.w/2, player.y+player.h*0.45, 14);
  return true;
}

function updateDreamCrowdYield(en, dt){
  const pc=player.x+player.w/2;
  const ec=en.x+en.w/2;
  const left=en.patrol[0];
  const right=en.patrol[1]-en.w;
  const target=ec<pc ? left : right;
  const speed=(en.fast?620:520)*dt;
  if(Math.abs(en.x-target)<=speed) en.x=target;
  else en.x+=Math.sign(target-en.x)*speed;
  en.vx=Math.sign(target-en.x||en.vx||1)*Math.abs(en.vx||60);
  en.dreamYield=0.35;
}

function doJump(){
  if(!MTUI.isActive()||won||dead) return;
  if(player.crouch) return;
  if(fx.slip>0) return;
  if(!player.onGround && coyoteT<=0) return;
  const boost=fx.boost>0;
  const wet=inPuddle(playerBox())&&fx.dry<=0;
  let j=boost?JUMP_BOOST:JUMP;
  if(wet) j*=0.68;
  else if(fx.tray>0&&fx.dry>0) j*=1.06;
  player.vy=-j;
  player.onGround=false;
  coyoteT=0;
  sfx.jump();
  spawnDust(player.x+player.w/2, player.y+player.h, 6);
}

function releaseTrayPickup(nearPlayer){
  if(trayDelivered) return;
  const t=ents.find(e=>e.type==="tray");
  if(!t) return;
  if(nearPlayer){
    t.hidden=false;
    t.x=Math.max(80, Math.min(WORLD_W-t.w, player.x+player.w/2-t.w/2));
    t.y=GROUND-t.h;
  } else {
    t.x=t.initX??1520;
    t.y=t.initY??(GROUND-46);
    t.hidden=fx.tray>0;
  }
}

function pickTray(e){
  if(fx.tray>0) return;
  if(!isFoodServed()){ MTUI.toast("窗口还没放餐"); return; }
  e.hidden=true;
  fx.tray=TRAY_TIME;
  sfx.pickup();
  MTUI.toast("端上了！只能走地面，别跳平台");
  updateHud();
}

function dropTray(stumble){
  if(fx.tray<=0) return;
  if(isDreamActive()&&stumble){ MTUI.toast("大家让开了，餐盘没掉"); return; }
  fx.tray=0;
  updateHud();
  if(trayDelivered) return;
  if(stumble){
    trayStumbles++;
    shakeT=0.22;
    sfx.bump();
    releaseTrayPickup(true);
    if(trayStumbles===1) MTUI.toast("餐盘掉了！捡起来，再摔一次就完了");
    else if(trayStumbles>=2){ MTUI.toast("全洒了…"); die(); }
  } else {
    releaseTrayPickup(true);
  }
}

function pickUmbrella(e){ e.hidden=true; fx.dry=14; sfx.pickup(); updateHud(); }
function stepBanana(e){
  e.hidden=true; fx.slip=1.7; fx.slipDir=player.facing||1;
  if(fx.tray>0) dropTray(true);
  sfx.slip(); shakeT=0.2; player.onGround=false; player.vy=-80;
  spawnDust(e.x+e.w/2,e.y,10);
  for(let i=0;i<6;i++) particles.push({x:e.x+e.w/2,y:e.y,vx:(Math.random()-0.5)*200,vy:-40-Math.random()*80,life:0,max:0.35,r:2+Math.random()*2,col:"#ffe066"});
  updateHud();
}

function stopCrash(){
  if(fx.crash<=0) return;
  fx.crash=0; player.vx=0; sfx.bump(); updateHud();
}

function spawnDust(x,y,n){ for(let i=0;i<n;i++) particles.push({x,y:y-2,vx:(Math.random()-0.5)*160,vy:-20-Math.random()*100,life:0,max:0.3+Math.random()*0.3,r:1.5+Math.random()*2}); }

function die(){
  if(dead) return;
  lives--; sfx.die(); shakeT=0.35;
  if(lives<=0){
    dead=true;
    setTimeout(()=>{
      MTUI.tryCoinContinue({
        score,
        gameOverCfg:{
          tag:"失败",
          title:"餐洒了",
          body:"生命用完了。"
        },
        onRevive(cost){
          score-=cost;
          lives=1;
          dead=false;
          respawnPlayer();
          updateHud();
          MTUI.toast(`-${cost} MT币，续命！`);
        }
      });
    },600);
  } else {
    dead=true;
    setTimeout(respawnPlayer,700);
  }
}

function showGameOver(){
  MTUI.showGameOver({
    tag:"失败",
    title:"餐洒了",
    body:"生命用完了。"
  });
}

function win(){
  if(won) return;
  won=true; sfx.win();
  setTimeout(()=>{
    MTUI.showWin({
      levelId: 4,
      title:"终于送到了！",
      body:`<em>CEO专座上的「国宴」—— 一桶泡面，加蛋。</em><small>CEO的幻想，又破功了。</small>`,
      nextUrl:"mt-level5-demo.html",
      nextLabel:"下一关"
    });
  },400);
}

function update(dt){
  if(won) return;
  if(dead) return;
  if(!MTUI.isActive()) return;
  T+=dt;
  if(gameMode==="bonus"){ updateBonus(dt); return; }

  if(fx.boost>0){ fx.boost-=dt; if(fx.boost<=0){ fx.boost=0; fx.crash=2.4; updateHud(); } }
  if(fx.crash>0) fx.crash-=dt;
  if(fx.slip>0) fx.slip-=dt;
  if(fx.dry>0) fx.dry-=dt;
  if(fx.smoke>0) fx.smoke-=dt;
  updateDream(dt);
  if(fx.tray>0){
    fx.tray-=dt;
    if(inPuddle(playerBox())&&fx.dry<=0&&!isDreamActive()) fx.tray-=dt*1.6;
    if(fx.tray<=0){
      fx.tray=0;
      if(!trayDelivered){
        releaseTrayPickup(true);
        MTUI.toast("餐盘掉在旁边了，快捡回来");
      }
      updateHud();
    }
  }
  if(fx.slip>0 && prevSlip<=0 && fx.tray>0 && !isDreamActive()) dropTray(true);
  if(fx.crash>0 && prevCrash<=0 && fx.tray>0 && !isDreamActive()) dropTray(true);
  prevSlip=fx.slip; prevCrash=fx.crash;
  if(invulnT>0) invulnT-=dt;
  if(passThroughT>0) passThroughT-=dt;

  ents.forEach(e=>{ if(e.type==="mover"){
    if(e.baseX===undefined){ e.baseX=e.x; e.prevOff=0; }
    const off=Math.sin(T*e.speed*(isDreamActive()?0.45:1))*e.range, d=off-e.prevOff;
    e.x=e.baseX+off;
    if(player.standingOn===e) player.x+=d;
    e.prevOff=off;
  }});

  ents.forEach(b=>{ if(b.type==="box"&&!b.hidden){
    b.vy=(b.vy||0)+GRAV*dt; b.y+=b.vy*dt;
    solids().forEach(s=>{ if(s!==b&&s.type!=="box"&&aabb(b,s)&&b.vy>=0&&b.y+b.h-b.vy*dt<=s.y+8){ b.y=s.y-b.h; b.vy=0; } });
    if(b.y>GROUND+80 && b.initX!==undefined){ b.x=b.initX; b.y=b.initY??GROUND-52; b.vy=0; }
  }});

  ents.forEach(en=>{ if(en.type==="enemy"&&!en.dead){
    if(isDreamActive()){
      updateDreamCrowdYield(en, dt);
      return;
    }
    const lunchRush=(T%9)<2.5;
    let spd=en.fast?1.35:1;
    if(lunchRush&&en.x>1880&&en.x<5200) spd*=1.28;
    en.x+=en.vx*spd*dt;
    if(en.x<=en.patrol[0]){ en.x=en.patrol[0]; en.vx=Math.abs(en.vx); }
    if(en.x+en.w>=en.patrol[1]){ en.x=en.patrol[1]-en.w; en.vx=-Math.abs(en.vx); }
  }});

  const rushCycle=Math.floor(T/9);
  if((T%9)<0.35&&rushCycle!==rushPhaseNotified&&player.x>1800&&player.x<5200){
    rushPhaseNotified=rushCycle;
    MTUI.toast("午餐高峰！食客加快了");
  }

  // 打印机烟雾 / 蒸汽
  for(const h of ents){
    if(h.type!=="hazard"||h.hidden) continue;
    const c=h.cycle||4, o=h.activeT||1.5;
    h.active=((T*(isDreamActive()?0.35:1)+(h.phase||0))%c)<o;
  }

  player.crouch=keys.down && player.onGround && !fx.crash && fx.slip<=0;

  // 浮空平台上按住 ↓ → 穿落下去
  if(keys.down && player.onGround && player.standingOn && isFloatPlat(player.standingOn)){
    passThroughPlat=player.standingOn; passThroughT=0.3;
    player.onGround=false; player.standingOn=null; player.vy=120;
  }

  let dir=(keys.right?1:0)-(keys.left?1:0);
  const pbPre=playerBox();
  const wet=inPuddle(pbPre)&&fx.dry<=0;

  if(fx.slip>0){
    player.vx=fx.slipDir*RUN*0.92;
    if(dir) player.facing=dir;
  } else if(fx.crash>0){
    player.vx=player.facing*(fx.boost>0?RUN*1.2:RUN);
  } else {
    const canRun=keys.run&&!player.crouch&&fx.tray<=0;
    let spd=(canRun||fx.boost>0)?RUN:MOVE;
    if(player.crouch) spd*=0.45;
    if(wet) spd*=0.42;
    if(fx.smoke>0) spd*=fx.dry>0?0.82:0.55;
    if(fx.tray>0) spd*=fx.dry>0?0.88:0.76;
    if(fx.boost>0 && !dir) player.vx=player.facing*spd*0.6;
    else { player.vx=dir*spd; if(dir) player.facing=dir; }
  }

  if(dir&&player.onGround&&!player.crouch){
    player.walkT+=dt; stepTimer-=dt;
    if(stepTimer<=0){
      sfx.step();
      if(wet){ sfx.splash(); splashT=0.12; spawnDust(player.x+player.w/2-dir*6,player.y+player.h,4); }
      else spawnDust(player.x+player.w/2-dir*6,player.y+player.h,2);
      stepTimer=wet?0.28:0.22;
    }
  }

  const pbBefore=playerBox();
  const prevFeetStomp=pbBefore.y+pbBefore.h;
  player.vy+=GRAV*dt;
  moveX(player.vx*dt);
  moveY(player.vy*dt);

  // 捡物 / 回收
  const pb=playerBox();
  for(const e of ents){
    if(e.type==="coin"&&!e.hidden&&aabb(pb,e)){ e.hidden=true; score+=10; sfx.coin(); MTUI.toast("+10 MT币"); }
    if(e.type==="tray"&&!e.hidden&&aabb(pb,e)) pickTray(e);
    if(e.type==="umbrella"&&!e.hidden&&aabb(pb,e)) pickUmbrella(e);
    if(e.type==="banana"&&!e.hidden&&aabb(pb,e)&&(player.onGround||player.vy>80)) stepBanana(e);
    if(e.type==="dropZone"&&!e.done&&fx.tray>0&&player.onGround&&aabb(pb,e)){
      fx.tray=0;
      e.done=true;
      score+=80;
      trayDelivered=true;
      sfx.coin();
      MTUI.toast("+80 MT币 收餐成功");
      updateHud();
    }
  }

  // 取餐窗口：停稳出餐
  for(const fw of ents){
    if(fw.type!=="foodWindow"||fw.served) continue;
    const zone={x:fw.x-24,y:fw.y-8,w:fw.w+48,h:fw.h+16};
    if(!aabb(pb,zone)){ fw.charge=Math.max(0,(fw.charge||0)-dt*1.5); continue; }
    const still=Math.abs(player.vx)<24&&player.onGround;
    if(still||player.crouch) fw.charge=Math.min(1,(fw.charge||0)+dt*(player.crouch?2.2:1.8));
    else fw.charge=Math.max(0,(fw.charge||0)-dt*2.5);
    if(fw.charge>=0.85){
      fw.served=true; fw.charge=1;
      sfx.pickup();
      MTUI.toast("窗口放餐了！拿餐盘");
      updateHud();
    }
  }

  // 隐藏入口：排队区人事部
  for(const st of ents){
    if(st.type!=="secretTrigger"||st.used) continue;
    const zone={x:st.x-12,y:st.y-10,w:st.w+24,h:st.h+20};
    if(!aabb(pb,zone)){ st.charge=Math.max(0,(st.charge||0)-dt*2); continue; }
    const still=Math.abs(player.vx)<18&&player.onGround;
    if(player.crouch&&still) st.charge=Math.min(1,(st.charge||0)+dt*2.2);
    else st.charge=Math.max(0,(st.charge||0)-dt*3);
    if(st.charge>=0.92) enterBonusRoom(st);
  }

  // 敌人
  for(const en of ents){ if(en.type==="enemy"&&!en.dead&&aabb(pb,en)){
    if(isDreamActive()) continue;
    if(invulnT>0) continue;
    if(canStompEnemy(pb,en,player.vy,prevFeetStomp)){
      en.dead=true; player.vy=-420; sfx.stomp(); score+=50;
    } else {
      if(fx.tray>0){ fx.tray=0; releaseTrayPickup(true); updateHud(); }
      die();
    }
  }}

  // 烟雾 / 蒸汽 / 尖刺 / 掉坑
  for(const h of ents){
    if(h.type!=="hazard"||!h.active) continue;
    if(!aabb(pb,h)) continue;
    if(h.kind==="steam"){
      if(isDreamActive()) continue;
      fx.smoke=Math.min(2.4,fx.smoke+dt*2.4);
      if(player.onGround) player.vx*=0.82;
      if(fx.tray>0) fx.tray-=dt*0.9;
    } else {
      fx.smoke=Math.min(2.8,fx.smoke+dt*2.2);
      if(fx.crash<=0&&fx.slip<=0&&player.onGround) player.vx*=0.86;
    }
  }
  if(invulnT<=0&&!isDreamActive()){
    for(const e of ents){ if(e.type==="spike"&&aabb(pb,e)) die(); }
  }
  if(player.y>VH+60) die();

  // 闸机：蹲或停稳才开
  for(const ts of ents){
    if(ts.type!=="turnstile") continue;
    const zone={x:ts.x-24,y:GROUND-62,w:ts.w+48,h:64};
    if(!aabb(pb,zone)){ ts.charge=Math.max(0,(ts.charge||0)-dt*2); continue; }
    if(ts.open){ ts.charge=1; continue; }
    const still=Math.abs(player.vx)<22&&player.onGround;
    if(player.crouch||still) ts.charge=Math.min(1,(ts.charge||0)+dt*(player.crouch?2.4:1.5));
    else ts.charge=Math.max(0,(ts.charge||0)-dt*3);
    if(ts.charge>=0.65) ts.open=true;
    if(ts.open) continue;
    const bar={x:ts.x,y:ts.y+8,w:ts.w,h:ts.h-8};
    if(!aabb(pb,bar)) continue;
    if(fx.crash>0){ stopCrash(); player.vx=-player.facing*RUN*0.85; sfx.bump(); break; }
    if(fx.tray>0 && Math.abs(player.vx)>280 && !isDreamActive()){ dropTray(true); player.vx=-player.facing*RUN*0.7; sfx.bump(); break; }
    player.vx=0;
    if(player.facing>0) player.x=ts.x-pb.w+(player.x-pb.x);
    else player.x=ts.x+ts.w+(player.x-pb.x);
    sfx.bump(); break;
  }

  // 低门：蹲下通过
  for(const g of ents){
    if(g.type!=="gate") continue;
    const bar=gateBar(g);
    if(!aabb(pb,bar)) continue;
    if(player.crouch) continue;
    if(fx.crash>0){ stopCrash(); break; }
    if(fx.tray>0 && Math.abs(player.vx)>220 && !isDreamActive()){ dropTray(true); player.vx=-player.facing*MOVE*0.6; sfx.bump(); break; }
    player.vx=0;
    if(player.facing>0) player.x=g.x-pb.w+(player.x-pb.x);
    else player.x=g.x+g.w+(player.x-pb.x);
    sfx.bump();
    break;
  }

  // Goal（需先回收餐盘）
  for(const g of ents){
    if(g.type!=="goal"||!aabb(pb,g)) continue;
    if(!trayDelivered){ MTUI.toast("先把餐送到回收处"); break; }
    win();
  }

  // 相机
  const target=player.x-VW*0.32;
  camX+=(target-camX)*Math.min(1,dt*8);
  camX=Math.max(0,Math.min(WORLD_W-VW,camX));

  for(const pt of particles){ pt.life+=dt; pt.vy+=900*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; }
  particles=particles.filter(pt=>pt.life<pt.max);
  if(splashT>0) splashT=Math.max(0,splashT-dt);
  if(player.squashT>0) player.squashT=Math.max(0,player.squashT-dt);
  if(!player.onGround) coyoteT=Math.max(0,coyoteT-dt);
  saveCheckpoint();
  updateHud();
}

function moveX(dx){
  if(!dx){ return; }
  const ox=player.x;
  player.x+=dx;
  const pb=playerBox();
  let blocked=false;
  for(const s of solids()){
    if(!solidBlocksX(pb,s)) continue;
    blocked=true;
    const off=player.x-pb.x;
    if(s.type==="box"){
      const pen=dx>0?(pb.x+pb.w)-s.x:pb.x-(s.x+s.w);
      s.x+=pen; let boxBlocked=false;
      for(const o of solids()){ if(o!==s&&o.type!=="box"&&aabb(s,o)){ boxBlocked=true; break; } }
      if(boxBlocked) s.x-=pen; else if(dx) sfx.push();
      if(dx>0) player.x=s.x-pb.w+off; else player.x=s.x+s.w+off;
    } else {
      if(dx>0) player.x=s.x-pb.w+off; else player.x=s.x+s.w+off;
    }
  }
  const beforeClamp=player.x;
  player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));
  if(fx.crash>0){
    const moved=Math.abs(player.x-ox), want=Math.abs(dx);
    if(blocked || beforeClamp!==player.x || (want>0.5 && moved<want*0.35)) stopCrash();
  }
  if(fx.slip>0 && blocked){ fx.slip=0; player.vx=0; sfx.bump(); updateHud(); }
  if(fx.tray>0 && blocked && Math.abs(player.vx)>280 && !isDreamActive()){ dropTray(true); player.vx=0; sfx.bump(); updateHud(); }
}

function moveY(dy){
  const prevPb=playerBox();
  const prevFeet=prevPb.y+prevPb.h;
  player.y+=dy;
  const was=player.onGround;
  player.onGround=false; player.standingOn=null;
  const pb=playerBox();

  for(const s of solids()){
    if(!solidBlocksY(pb,s,dy,prevFeet)) continue;
    if(dy>0){
      player.y=s.y-player.h; player.vy=0; player.onGround=true; player.standingOn=s;
      if(fx.crash>0 && !was) stopCrash();   // 空中落地才刹停
    } else if(dy<0){
      player.y=s.y+s.h-(pb.y-player.y)-pb.h; player.vy=0;
      if(fx.crash>0) stopCrash();            // 顶到天花板
    }
  }
  if(player.onGround&&!was){ sfx.land(); player.squashT=0.15; spawnDust(player.x+player.w/2,player.y+player.h,8); }
  if(player.onGround) coyoteT=0.1;
}

/* ===== 绘制 ===== */
let _seed=1;
function srand(s){ _seed=s>>>0; }
function rnd(){ _seed=(_seed*1664525+1013904223)>>>0; return _seed/4294967296; }
function jit(a){ return (rnd()-0.5)*a; }
function rline(x1,y1,x2,y2){ const mx=(x1+x2)/2+jit(3),my=(y1+y2)/2+jit(3);
  ctx.beginPath(); ctx.moveTo(x1+jit(1),y1+jit(1)); ctx.quadraticCurveTo(mx,my,x2+jit(1),y2+jit(1)); ctx.stroke(); }
function rrect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }

function fillStroke(){ ctx.fill(); ctx.stroke(); }

function drawCoffee(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*5)*2.5;
  const y=e.y+bob;

  // 文案「咖啡」
  ctx.fillStyle="#fff9f0"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(cx-24,y,48,20,5); fillStroke();
  ctx.fillStyle=INK; ctx.font="800 13px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("咖啡",cx,y+14); ctx.textAlign="left";

  // 杯身
  const cupTop=y+24, cupW=22, cupH=22;
  ctx.fillStyle="#d4a574"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(cx,cupTop,10,Math.PI,0); ctx.stroke();
  ctx.fillStyle="#b87d4b";
  rrect(cx-cupW/2,cupTop,cupW,cupH,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#f5e6d3"; ctx.fillRect(cx-cupW/2+3,cupTop+4,cupW-6,8);

  // 热气
  ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.globalAlpha=0.45;
  rline(cx-4,cupTop-2,cx-6,cupTop-10); rline(cx,cupTop-4,cx,cupTop-14); rline(cx+4,cupTop-2,cx+6,cupTop-10);
  ctx.globalAlpha=1;
}

function drawBanana(e){
  const cx=e.x+e.w/2, cy=e.y+e.h/2;
  ctx.fillStyle="#ffe566"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-14,cy+2); ctx.quadraticCurveTo(cx,cy-8,cx+14,cy+2);
  ctx.quadraticCurveTo(cx+4,cy+6,cx-14,cy+2); ctx.closePath(); fillStroke();
  ctx.strokeStyle="rgba(37,37,37,.35)"; ctx.lineWidth=1.5;
  rline(cx-6,cy-2,cx+2,cy+1);
}

function drawPuddle(e){
  const cx=e.x+e.w/2, cy=e.y+e.h/2+2, rx=e.w/2, ry=5+Math.sin(T*4+cx)*0.8;
  const oil=e.kind==="oil";
  ctx.fillStyle=oil?"rgba(160,120,45,.42)":"rgba(100,165,210,.35)";
  ctx.strokeStyle=oil?"rgba(80,60,20,.35)":"rgba(42,42,42,.25)"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1;
  rline(cx-rx*0.5,cy-1,cx-rx*0.2,cy-2); rline(cx+rx*0.15,cy,cx+rx*0.45,cy-1);
}

function drawBadge(e){
  const cx=e.x+e.w/2, bob=Math.sin(T*4)*2;
  ctx.fillStyle="#fff"; ctx.strokeStyle=INK; ctx.lineWidth=2;
  rrect(cx-14,e.y+bob,28,36,4); fillStroke();
  ctx.fillStyle=INK; ctx.font="800 9px PingFang SC,sans-serif"; ctx.textAlign="center";
  ctx.fillText("工牌",cx,e.y+bob+22); ctx.textAlign="left";
  ctx.strokeStyle=INK; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx,e.y+bob+36); ctx.lineTo(cx,e.y+bob+44); ctx.stroke();
}

function drawTurnstile(e){
  const cx=e.x+e.w/2, open=e.open;
  const pct=open?1:Math.min(1,e.charge||0);
  ctx.fillStyle="#d0cdc6"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
  rrect(e.x,e.y+8,e.w,e.h-8,3); fillStroke();
  ctx.fillStyle=open?"#7ec87a":"#c9956a";
  rrect(e.x+4,e.y+e.h-14,e.w-8,6,2); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=3;
  const ang=open?Math.PI/2:Math.PI/2*(1-pct);
  ctx.save(); ctx.translate(cx,e.y+e.h-4); ctx.rotate(ang);
  rline(-18,0,18,0); ctx.restore();
  ctx.save(); ctx.translate(cx,e.y+e.h-4); ctx.rotate(-ang);
  rline(-18,0,18,0); ctx.restore();
  if(!open && pct>0.05){
    ctx.fillStyle="rgba(37,37,37,.55)"; ctx.font="600 9px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("停",cx,e.y+22); ctx.textAlign="left";

}

function drawWorld(){
  ctx.save(); ctx.translate(-camX,0);
  srand(20240611); ctx.strokeStyle=INK; ctx.lineCap="round"; ctx.lineJoin="round";

  for(const e of ents){
    if(e.hidden && !(e.route==="trayCeiling" && trayBlocksUpper())) continue;
    if(e.type==="platform"||e.type==="mover"){
      const upperBlocked=trayBlocksUpper()&&isUpperPlat(e);
      const isCeiling=e.route==="trayCeiling";
      ctx.fillStyle=e.ground?PAPER:(upperBlocked?"rgba(255,235,235,.92)":(isCeiling?"rgba(42,42,42,.18)":"#fff"));
      ctx.lineWidth=e.ground?3:(isCeiling?2:2.5);
      if(upperBlocked) ctx.setLineDash([6,4]);
      rrect(e.x,e.y,e.w,e.h,e.ground?0:5); fillStroke();
      if(upperBlocked) ctx.setLineDash([]);
      if(e.ground){
        ctx.lineWidth=2; ctx.strokeStyle="rgba(42,42,42,.15)";
        rline(e.x+6,e.y+1,e.x+e.w-6,e.y+1);
        ctx.strokeStyle=INK;
      } else if(isCeiling){
        ctx.fillStyle="rgba(42,42,42,.35)"; ctx.font="700 10px PingFang SC,sans-serif"; ctx.textAlign="center";
        ctx.fillText("端盘禁入",e.x+e.w/2,e.y+e.h/2+4); ctx.textAlign="left";
      } else {
        ctx.lineWidth=1.5; ctx.strokeStyle="rgba(42,42,42,.2)";
        for(let i=e.x+10;i<e.x+e.w-8;i+=16) rline(i,e.y+e.h,i-3,e.y+e.h+5);
        ctx.strokeStyle=INK;
        if(upperBlocked){
          ctx.fillStyle="#b44"; ctx.font="800 11px PingFang SC,sans-serif"; ctx.textAlign="center";
          ctx.fillText("禁",e.x+e.w/2,e.y+e.h/2+4); ctx.textAlign="left";
        }
      }
      if(e.type==="mover"){
        ctx.fillStyle=INK; ctx.font="600 11px PingFang SC,sans-serif"; ctx.textAlign="center";
        ctx.fillText(e.label||"移动台",e.x+e.w/2,e.y+12); ctx.textAlign="left";
      }
    } else if(e.type==="box"){
      ctx.fillStyle="#fff"; ctx.lineWidth=2.5;
      rrect(e.x,e.y,e.w,e.h,4); fillStroke();
      ctx.strokeStyle=INK; ctx.lineWidth=2;
      rline(e.x+8,e.y+14,e.x+e.w-8,e.y+14); rline(e.x+14,e.y+22,e.x+e.w-14,e.y+36);
      ctx.font="600 10px PingFang SC,sans-serif"; ctx.textAlign="center"; ctx.fillStyle=INK;
      ctx.fillText(e.label||"快递",e.x+e.w/2,e.y+e.h-8); ctx.textAlign="left";
    } else if(e.type==="spike"){
      ctx.lineWidth=2; ctx.fillStyle="#fff8ea"; ctx.strokeStyle=INK;
      for(let i=0;i<Math.floor(e.w/20);i++){ const sx=e.x+i*20;
        ctx.beginPath(); ctx.moveTo(sx,e.y+e.h); ctx.lineTo(sx+10,e.y+jit(2)); ctx.lineTo(sx+20,e.y+e.h); ctx.closePath(); fillStroke(); }
    } else if(e.type==="gate"){
      const barH=12;
      ctx.fillStyle=INK; ctx.lineWidth=2.5;
      rrect(e.x,e.y,e.w,barH,2); ctx.fill();
      ctx.strokeStyle=INK;
      rline(e.x+5,e.y+barH,e.x+5,e.y+e.h); rline(e.x+e.w-5,e.y+barH,e.x+e.w-5,e.y+e.h);
      ctx.fillStyle="rgba(42,42,42,.4)"; ctx.font="600 10px PingFang SC,sans-serif"; ctx.textAlign="center";
      ctx.fillText("蹲",e.x+e.w/2,e.y+e.h-8); ctx.textAlign="left";
    } else if(e.type==="secretTrigger"){
      drawSecretTrigger(e);
    } else if(e.type==="turnstile"){
      drawTurnstile(e);
    } else if(e.type==="foodWindow"){
      drawFoodWindow(e);
    } else if(e.type==="tray"){
      drawTray(e);
    } else if(e.type==="dropZone"){
      drawDropZone(e);
    } else if(e.type==="printer"){
      drawPrinter(e);
    } else if(e.type==="door"){
      drawDoor(e);
    } else if(e.type==="hazard"){
      drawHazard(e);
    } else if(e.type==="coin"){
      const cx=e.x+e.w/2, cy=e.y+e.h/2, r=8;
      ctx.fillStyle="#ffe08a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(cx-2,cy-2,2.5,0,7); ctx.fill();
      ctx.fillStyle=INK; ctx.font="700 8px sans-serif"; ctx.textAlign="center"; ctx.fillText("M",cx,cy+3); ctx.textAlign="left";
    } else if(e.type==="coffee"){
      drawCoffee(e);
    } else if(e.type==="banana"){
      drawBanana(e);
    } else if(e.type==="puddle"){
      drawPuddle(e);
    } else if(e.type==="umbrella"){
      drawSlippers(e);
    } else if(e.type==="enemy"&&!e.dead){
      drawEnemy(e);
    } else if(e.type==="goal"){
      drawNoodlesGoal(e);
    }
  }

  ctx.lineWidth=3; rline(0,GROUND,WORLD_W,GROUND);
  ctx.restore();
}


function drawEnemyVector(e,facing){
  const walk=Math.sin(T*10+ e.x*0.02);
  const BLK=INK;
  ctx.save();
  ctx.translate(e.x+e.w/2,e.y+e.h);
  if(facing<0) ctx.scale(-1,1);
  ctx.lineCap="round"; ctx.lineJoin="round";
  // 腿
  ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-5,-12); ctx.lineTo(-5-walk*4,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5-walk*4,0); ctx.lineTo(-5-walk*4+facing*5,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-12); ctx.lineTo(5+walk*4,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5+walk*4,0); ctx.lineTo(5+walk*4+facing*5,0); ctx.stroke();
  // 身体（比 Zack 瘦一点、浅色衫）
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-8,-36); ctx.quadraticCurveTo(-10,-24,-7,-12);
  ctx.lineTo(7,-12); ctx.quadraticCurveTo(10,-24,8,-36); ctx.closePath(); fillStroke();
  // 通勤包
  ctx.fillStyle="#e8dfd3"; ctx.strokeStyle=BLK; ctx.lineWidth=1.8;
  ctx.strokeRect(6,-28,7,10); ctx.fillRect(6,-28,7,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,-28); ctx.lineTo(9,-32); ctx.stroke();
  // 手臂
  ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-7,-30); ctx.lineTo(-11,-22+walk*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7,-30); ctx.lineTo(12,-24-walk*2); ctx.stroke();
  // 头
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,-40,9,0,7); ctx.fill(); ctx.stroke();
  // 脸（无眼镜，和 Zack 区分）
  ctx.fillStyle=BLK;
  ctx.beginPath(); ctx.arc(-3,-41,1.5,0,7); ctx.arc(3,-41,1.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3,-36); ctx.quadraticCurveTo(0,-35,3,-36); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e){
  const facing=e.vx>=0?1:-1;
  const spr=enemySprites.walk;
  const cx=e.x+e.w/2, foot=e.y+e.h;
  const bob=Math.sin(T*10+e.x*0.02)*1.5;
  if(isDreamActive()){
    ctx.save();
    ctx.globalAlpha=0.92;
    ctx.fillStyle="#fffdf9";
    ctx.strokeStyle=INK;
    ctx.lineWidth=2;
    rrect(cx-14, e.y-28, 28, 20, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK;
    ctx.font="800 12px PingFang SC,sans-serif";
    ctx.textAlign="center";
    ctx.fillText("让", cx, e.y-14);
    ctx.textAlign="left";
    ctx.strokeStyle="#58a6b8";
    ctx.lineWidth=2;
    const dir=(e.x+e.w/2)<(player.x+player.w/2)?-1:1;
    for(let i=0;i<3;i++){
      const y=e.y+12+i*11;
      rline(cx-dir*(20+i*6), y, cx-dir*(36+i*8), y-3);
    }
    ctx.restore();
  }
  if(spr){
    ctx.save();
    ctx.translate(cx,foot+bob);
    if(facing<0) ctx.scale(-1,1);
    const dh=e.h+4, dw=dh*(spr.width/spr.height);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(spr,-dw/2,-dh,dw,dh);
    ctx.restore();
  } else {
    drawEnemyVector(e,facing);
  }
}
bgSlots.forEach(s=>loadBg(s.id));
signSlots.forEach(s=>loadBg(s.id,s.alt));

loadSprite(IMG+"hero.png","idle");
loadSprite(IMG+"hero_jump.png","jump");
loadSprite(IMG+"hero_run.png","run");

function drawPlayer(){
  const p=player; const cx=p.x+p.w/2-camX, footY=p.y+p.h;
  const air=!p.onGround, moving=keys.left||keys.right||Math.abs(p.vx)>30;
  if(isDreamActive()) drawDreamTrayField(cx, footY-44);
  // 挤压拉伸形变（以脚底为锚点）
  let sx=1, sy=1;
  if(p.squashT>0){ const k=p.squashT/0.18; sy=1-0.30*k; sx=1+0.30*k; }
  else if(p.crouch&&p.onGround){ sy=0.58; sx=1.08; }
  else if(air){ const st=Math.max(0,Math.min(0.34,Math.abs(p.vy)/3000)); sy=1+st; sx=1-st*0.55; }
  // 按动作选贴图
  let spr;
  if(air) spr=sprites.jump||sprites.idle;
  else if(moving&&!p.crouch) spr=sprites.run||sprites.idle;
  else spr=sprites.idle;
  ctx.save();
  if(invulnT>0 && Math.sin(T*24)>0) ctx.globalAlpha=0.45;
  ctx.translate(cx, footY);
  ctx.scale(sx, sy);
  if(dead) ctx.rotate(p.facing*1.25);
  else if(fx.slip>0) ctx.rotate(Math.sin(T*28)*0.38*(p.facing||1));
  else if(air) ctx.rotate(Math.max(-0.2,Math.min(0.22, p.vy/3800))*(p.facing||1));
  if(spr){
    const dh=80, dw=dh*(spr.width/spr.height);
    if(p.facing<0) ctx.scale(-1,1);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(spr, -dw/2, -dh, dw, dh);
  } else {
    drawGuyVector(p);   // 没有贴图时回退到矢量绘制
  }
  ctx.restore();
  if(fx.tray>0){
    ctx.save();
    ctx.translate(p.x+p.w/2-camX, p.y+p.h-52);
    if(isDreamActive()) ctx.translate(Math.sin(T*7)*4, -12-Math.sin(T*9)*4);
    if(p.facing<0) ctx.scale(-1,1);
    ctx.fillStyle="#e8e4dc"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    rrect(-16,-4,32,5,2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#fff"; rrect(-12,1,24,14,2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#d4a574"; ctx.fillRect(-8,3,16,5);
    ctx.restore();
  }
}

function drawDreamTrayField(cx, cy){
  const pulse=(Math.sin(T*8)+1)/2;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=0.28;
  const g=ctx.createRadialGradient(cx,cy,8,cx,cy,76+pulse*10);
  g.addColorStop(0,"rgba(232,184,74,.55)");
  g.addColorStop(0.45,"rgba(126,183,214,.28)");
  g.addColorStop(1,"rgba(126,183,214,0)");
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,76+pulse*10,0,7); ctx.fill();
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=0.8;
  ctx.strokeStyle="#58a6b8";
  ctx.lineWidth=2.5;
  ctx.setLineDash([6,7]);
  ctx.beginPath(); ctx.ellipse(cx,cy+16,48+pulse*8,18+pulse*3,0,0,7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle="#e8b84a";
  ctx.lineWidth=2;
  for(let i=0;i<4;i++){
    const x=cx-30+i*20+Math.sin(T*5+i)*4;
    ctx.beginPath();
    ctx.moveTo(x,cy+22);
    ctx.quadraticCurveTo(x+8,cy+8,x+16,cy-10);
    ctx.stroke();
  }
  ctx.restore();
}

function drawDreamOverlay(){
  if(!isDreamActive()) return;
  ctx.save();
  ctx.globalAlpha=0.055+Math.sin(T*6)*0.012;
  ctx.fillStyle="#e8b84a";
  ctx.fillRect(0,0,VW,VH);
  ctx.restore();
}

function drawGuyVector(p){
  const walking = p.onGround && (keys.left||keys.right);
  const walk = walking ? Math.sin(p.walkT*12) : 0;
  const air = !p.onGround;
  const BLK="#1c1c1c";
  ctx.lineJoin="round"; ctx.lineCap="round";

  // 腿 + 带方向的小脚
  ctx.strokeStyle=BLK; ctx.lineWidth=4.5;
  const lA = air ? 3 : (5 + walk*5);
  const lB = air ? 3 : (5 - walk*5);
  ctx.beginPath(); ctx.moveTo(-6,-13); ctx.lineTo(-6-lA*0.5,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6-lA*0.5,0); ctx.lineTo(-6-lA*0.5+p.facing*6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,-13);  ctx.lineTo(6+lB*0.5,-1);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6+lB*0.5,0);  ctx.lineTo(6+lB*0.5+p.facing*6,0); ctx.stroke();

  // 身体（黑衬衫，圆胖）
  const bTop=-37, bBot=-12;
  ctx.fillStyle=BLK; ctx.strokeStyle=BLK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-9,bTop);
  ctx.bezierCurveTo(-22,bTop+5,-21,bBot-3,-15,bBot);
  ctx.quadraticCurveTo(0,bBot+7,15,bBot);
  ctx.bezierCurveTo(21,bBot-3,22,bTop+5,9,bTop);
  ctx.closePath(); ctx.fill();

  // 手臂（黑粗线，圆头手；空中上扬 / 走路前后摆）
  ctx.strokeStyle=BLK; ctx.lineWidth=5;
  const armS = air ? -9 : walk*3;
  ctx.beginPath(); ctx.moveTo(-13,bTop+6); ctx.quadraticCurveTo(-23,bTop+16,-22,bTop+27+armS); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13,bTop+6);  ctx.quadraticCurveTo(23,bTop+16,22,bTop+27-armS);  ctx.stroke();

  // 工牌
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=1.2;
  rrect(-8,bTop-10,16,8,2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=BLK; ctx.font="bold 5px sans-serif"; ctx.textAlign="center";
  ctx.fillText("CEO",0,bTop-4); ctx.textAlign="left";
  ctx.strokeStyle="#fff"; ctx.fillStyle="#fff"; ctx.lineWidth=1.7;
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(1,bBot+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(-9,bTop+1); ctx.lineTo(-3,bTop+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(11,bTop+1); ctx.lineTo(5,bTop+10); ctx.stroke();
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(1,bTop+14+i*6,1.4,0,7); ctx.fill(); }

  // 头（白 黑边）
  const hY=-50, hR=13;
  ctx.fillStyle="#fdfdfd"; ctx.strokeStyle=BLK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,hY,hR,0,7); ctx.fill(); ctx.stroke();

  // 寸头发茬（只在左半边到头顶，右边是光的；随朝向镜像）
  ctx.lineWidth=1.7;
  for(let a=-Math.PI*1.02; a<=-Math.PI*0.32; a+=Math.PI*0.052){
    const ang = p.facing>=0 ? a : (-Math.PI - a);
    const hx=Math.cos(ang)*hR, hy=hY+Math.sin(ang)*hR;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ang)*6, hy+Math.sin(ang)*6); ctx.stroke();
  }

  const fx=p.facing*2;
  if(dead){
    ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(fx-9,hY-3); ctx.lineTo(fx-3,hY+3); ctx.moveTo(fx-3,hY-3); ctx.lineTo(fx-9,hY+3);
    ctx.moveTo(fx+3,hY-3); ctx.lineTo(fx+9,hY+3); ctx.moveTo(fx+9,hY-3); ctx.lineTo(fx+3,hY+3); ctx.stroke();
  } else {
    // 黑框方形眼镜
    function lens(cxL){ const w=11,h=8,r=2.5,x=fx+cxL-w/2,y=hY-1-h/2;
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); }
    ctx.fillStyle="#fdfdfd"; ctx.strokeStyle=BLK; ctx.lineWidth=2.3;
    lens(-6); ctx.fill(); ctx.stroke();
    lens(7);  ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx-0.5,hY-1); ctx.lineTo(fx+1.5,hY-1); ctx.stroke();      // 横梁
    ctx.beginPath(); ctx.moveTo(fx-11.5,hY-2); ctx.lineTo(fx-15,hY-4); ctx.stroke();      // 镜腿
    // 眼睛（大黑点）
    ctx.fillStyle=BLK;
    ctx.beginPath(); ctx.arc(fx-6,hY-1,2.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+7,hY-1,2.6,0,7); ctx.fill();
    // 嘴（略撇的平嘴）
    ctx.strokeStyle=BLK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-5,hY+9); ctx.quadraticCurveTo(fx,hY+7,fx+5,hY+9); ctx.stroke();
  }
}
function drawParticles(){
  for(const pt of particles){
    const a=Math.max(0,1-pt.life/pt.max);
    ctx.globalAlpha=a*0.55; ctx.fillStyle=pt.col||"#888";
    ctx.beginPath(); ctx.arc(pt.x-camX,pt.y,pt.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.save();
  if(shakeT>0){ shakeT-=0.016; ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6); }
  if(gameMode==="bonus"){
    drawBonusRoom();
    drawParticles();
    drawPlayer();
  } else {
    drawBackground(); drawWorld(); drawParticles(); drawPlayer(); drawFog();
    drawDreamOverlay();
  }
  ctx.restore();
}

let last=0;
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000||0); last=t;
  if(MTUI.isActive()) update(dt);
  render();
  MTUI.syncKeys(keys);
  requestAnimationFrame(loop);
}

/* ===== 输入 & UI ===== */
MTUI.bindKeys(keys, doJump, ensureAudio);
function bindDreamControls(){
  const btn=document.getElementById("btn_dream");
  if(btn) btn.addEventListener("click", startDream);
  addEventListener("keydown", e=>{
    if(e.code==="KeyE"&&!e.repeat){
      e.preventDefault();
      startDream();
    }
  });
}
bindDreamControls();

  startTitle:"食堂高峰（梦境试验）",
  startBody:"按 E / 点“梦”开启开路梦；餐盘会飞到身边并悬浮，食客和经理会纷纷让路；用完冷却 10 秒。",
  startBtn:"去排队",
  ensureAudio,
  toggleSound(){ soundOn=!soundOn; if(window.MTBGM) MTBGM.setSoundOn(soundOn); return soundOn; },
  getSessionStats(){ return { score, livesLeft: lives }; },
  getHelpHint,
  isTerminal(){ return won||lives<=0; },
  onBeforeStart(){ resetGame(); },
  onRetry(){ resetGame(); },
  onInit(){ resetGame(); }
});
requestAnimationFrame(loop);
