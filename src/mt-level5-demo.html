/* ===== 音效 ===== */
let actx=null, soundOn=true;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==="suspended") actx.resume();
  if(window.MTBGM) MTBGM.attach(actx); }
function tone(f,dur,type="square",vol=0.18,slideTo=null){
  if(!actx||!soundOn) return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}
const sfx={
  jump:()=>tone(380,0.15,"triangle",0.2,720),
  land:()=>tone(150,0.06,"square",0.1),
  step:()=>tone(210,0.03,"square",0.04),
  push:()=>tone(110,0.08,"sawtooth",0.08,90),
  pickup:()=>{tone(700,0.08,"square",0.16);setTimeout(()=>tone(1050,0.12,"square",0.16),70);},
  bump:()=>tone(300,0.09,"square",0.16,180),
  stomp:()=>tone(200,0.1,"square",0.15,80),
  slip:()=>{tone(320,0.12,"sawtooth",0.14,90);setTimeout(()=>tone(180,0.18,"sawtooth",0.1,60),80);},
  splash:()=>tone(420,0.05,"triangle",0.06),
  coin:()=>tone(880,0.08,"triangle",0.14),
  die:()=>{tone(400,0.18,"sawtooth",0.2,120);setTimeout(()=>tone(200,0.25,"sawtooth",0.18,60),120);},
  win:()=>{tone(523,0.12,"triangle",0.2);setTimeout(()=>tone(659,0.12,"triangle",0.2),110);setTimeout(()=>tone(784,0.24,"triangle",0.22),230);},
};

/* ===== 关卡5 · CEO办公室（四段式：前台 → 办公室 → 档案 → 董事会） ===== */
const BRIEF_TIME=30;
const ents=[
  // A 前台 · 领门禁
  {type:"platform",x:-20,y:GROUND,w:660,h:80,ground:true,zone:"hall"},
  {type:"npc",x:220,y:GROUND-92,w:52,h:92,label:"行政",need:"still",charge:0,served:false,give:"access"},

  {type:"coin",x:340,y:GROUND-28,w:22,h:22},

  {type:"spike",x:840,y:GROUND-24,w:400,h:24,label:"搬家沟"},

  {type:"box",x:700,y:GROUND-52,w:52,h:52,label:"CEO椅",heavy:true,initX:700,initY:GROUND-52},
  {type:"platform",x:1240,y:GROUND,w:260,h:80,ground:true},
  {type:"enemy",x:1180,y:GROUND-46,w:36,h:46,vx:58,patrol:[1000,1320],label:"同事"},

  {type:"platform",x:1500,y:GROUND,w:1600,h:80,ground:true,zone:"myoffice"},

  {type:"hazard",x:1600,y:GROUND-44,w:150,h:40,kind:"smoke",cycle:3.2,activeT:1.7,phase:0,id:"printerSmoke"},
  {type:"npc",x:1780,y:GROUND-92,w:52,h:92,label:"秘书",need:"crouch",charge:0,served:false,give:"badge"},
  {type:"gate",x:1880,y:GROUND-70,w:95,h:70,need:"appointment"},
  {type:"enemy",x:2180,y:GROUND-46,w:36,h:46,vx:-62,patrol:[2000,2380],label:"同事"},
  {type:"enemy",x:2720,y:GROUND-46,w:36,h:46,vx:55,patrol:[2520,2920],label:"同事"},
  {type:"coin",x:2100,y:GROUND-28,w:22,h:22},

  // D 档案 · 第二闸机 + 推箱
  {type:"turnstile",x:3160,y:GROUND-58,w:52,h:58,charge:0,open:false,id:"ts2"},
  {type:"platform",x:3100,y:GROUND,w:140,h:80,ground:true},
  {type:"spike",x:3240,y:GROUND-24,w:420,h:24,label:"资料沟"},
  {type:"platform",x:3320,y:408,w:540,h:16,boxSlot:true},
  {type:"box",x:3120,y:GROUND-52,w:52,h:52,label:"档案",heavy:true,initX:3120,initY:GROUND-52},
  {type:"platform",x:3660,y:GROUND,w:1540,h:80,ground:true},
  {type:"enemy",x:3780,y:GROUND-46,w:36,h:46,vx:-60,patrol:[3660,4020],label:"同事"},
  {type:"enemy",x:3900,y:GROUND-46,w:36,h:46,vx:62,patrol:[3720,4140],label:"行政"},
  {type:"enemy",x:4380,y:GROUND-46,w:36,h:46,vx:68,patrol:[4180,4520],label:"行政",fast:true},

  {type:"platform",x:5200,y:GROUND,w:280,h:80,ground:true,zone:"corner"},

  {type:"banana",x:6120,y:298,w:32,h:14,initX:6120},
  {type:"hideSpot",x:5980,y:GROUND-58,w:100,h:58},
  {type:"hideSpot",x:6380,y:GROUND-58,w:100,h:58},
  {type:"npc",x:6280,y:GROUND-92,w:52,h:92,label:"助理",need:"still",charge:0,served:false,give:"brief"},
  {type:"dropZone",x:6680,y:GROUND-10,w:150,h:14,label:"交文件",done:false},

  {type:"enemy",x:6520,y:GROUND-46,w:36,h:46,vx:92,patrol:[6000,6900],label:"经理",fast:true,id:"manager"},
  {type:"mic",x:6860,y:GROUND-72,w:90,h:72,need:1.15,unlock:"sit",charge:0,open:false,padX:20},
  {type:"platform",x:6820,y:GROUND-8,w:180,h:12,hidden:true,unlockGroup:"sit"},
  {type:"goal",x:6980,y:GROUND-100,w:90,h:100,label:"CEO位",hidden:true,unlockGroup:"sit"},
  {type:"coin",x:5600,y:GROUND-28,w:22,h:22},
  {type:"coin",x:6900,y:GROUND-28,w:22,h:22},
];

const bgSlots=[
  {id:"bg_5_1_sky", x:0, y:0, w:WORLD_W, h:180},
];

const signSlots=[
  {id:"ui_sign_office", x:1520, y:GROUND-118, w:88, h:48, poleX:1564, label:"CEO办公室"},
  {id:"ui_sign_desk", x:6880, y:GROUND-118, w:72, h:48, poleX:6916, label:"落座"},
];

const player={x:80,y:GROUND-60,w:40,h:60,vx:0,vy:0,onGround:false,facing:1,walkT:0,squashT:0,crouch:false};
const keys={left:false,right:false,down:false,run:false};
let camX=0, T=0, lives=MAX_LIVES, score=0, won=false, dead=false, shakeT=0;
let fx={boost:0,crash:0,slip:0,slipDir:1,dry:0,smoke:0,brief:0};
let particles=[], splashT=0;
let passThroughPlat=null, passThroughT=0;
let coyoteT=0;
let checkpoint={x:80,y:GROUND-60,facing:1};
let invulnT=0;
let hasAccessCard=false, hasAppointment=false, hasCeoBadge=false, briefDelivered=false;
let gateWarnT=0, boardRushNotified=-1, prevCrash=0, prevSlip=0;
let prevLives=MAX_LIVES;

const MOVE=300, RUN=480, GRAV=2200, JUMP=820, JUMP_BOOST=960;
// 跑跳水平极限 ≈352px（dt=1/60 模拟）；推箱沟宽 >352 且不推过不去
const JUMP_RUN_X=352;
let stepTimer=0;

function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function isFloatPlat(s){ return s.type==="platform"&&!s.ground; }
function platBlocksX(pb,s){
  if(s===passThroughPlat&&passThroughT>0) return false;
  if(!isFloatPlat(s)||!aabb(pb,s)) return false;
  if(fx.crash>0) return true;           // 停不住时碰到平台就挡
  if(pb.y>=s.y+s.h-2) return false;     // 下蹲时身体低于平台底边 → 可钻过去
  if(player.y+player.h<=s.y+4) return false;
  return true;
}
function platBlocksY(pb,s,dy,prevFeet){
  if(s===passThroughPlat&&passThroughT>0) return false;
  if(!isFloatPlat(s)||!aabb(pb,s)) return false;
  if(dy>0) return prevFeet<=s.y+6;   // 仅能从上方落下
  return false;                       // 从下方穿过，不顶头
}
function solidBlocksX(pb,s){
  if(s.type==="door") return !isDoorOpen(s)&&aabb(pb,s);
  if(s.type==="box"||s.type==="mover") return aabb(pb,s);
  if(isFloatPlat(s)) return platBlocksX(pb,s);
  return aabb(pb,s);
}
function solidBlocksY(pb,s,dy,prevFeet){
  if(s.type==="door") return !isDoorOpen(s)&&aabb(pb,s);
  if(s.type==="box"||s.type==="mover") return aabb(pb,s);
  if(isFloatPlat(s)) return platBlocksY(pb,s,dy,prevFeet);
  return aabb(pb,s);
}
function boxSolidBlocks(b,s){
  if(s.type==="box"||s.type==="mover") return aabb(b,s);
  if(s.type==="door"&&(!isDoorOpen(s))) return aabb(b,s);
  if(!isFloatPlat(s)) return aabb(b,s);
  if(!aabb(b,s)) return false;
  const feet=b.y+b.h;
  if(Math.abs(feet-s.y)<6&&b.x+b.w>s.x+8&&b.x<s.x+s.w-8) return false;
  if(feet<=s.y+6&&feet>=s.y-4) return true;
  if(feet>s.y+8) return false;
  return true;
}
function tryMountBox(b,s,dx){
  if(!isFloatPlat(s)||!s.boxSlot||!dx) return false;
  if(b.y+b.h>GROUND+2) return false;
  if(b.x+b.w<s.x+4||b.x+b.w>s.x+28) return false;
  b.y=s.y-b.h; b.vy=0;
  return true;
}
function isDoorOpen(d){
  const c=d.cycle||4, o=d.openT||1;
  return ((T+(d.phase||0))%c)<o;
}
function solids(){ return ents.filter(e=>(e.type==="platform"&&!e.hidden)||e.type==="box"||e.type==="mover"||(e.type==="door"&&!isDoorOpen(e))); }
function gateBar(g){ return {x:g.x, y:g.y, w:g.w, h:12}; }

function playerBox(){
  const c=player.crouch && player.onGround;
  return {x:player.x+(c?6:0), y:player.y+(c?20:0), w:player.w-(c?12:0), h:player.h-(c?20:0)};
}
function canStompEnemy(pb,en,vy,prevFeet){
  if(vy<=80) return false;
  const feet=pb.y+pb.h;
  if(feet>en.y+16||prevFeet>en.y+8) return false;
  return pb.x+pb.w>en.x+6&&pb.x<en.x+en.w-6;
}

function inPuddle(pb){
  for(const e of ents) if(e.type==="puddle"&&!e.hidden&&aabb(pb,e)) return true;
  return false;
}

function inSpike(pb){
  for(const e of ents) if(e.type==="spike"&&!e.hidden&&aabb(pb,e)) return true;
  return false;
}

function findSafeSpawn(preferX){
  const w=player.w, h=player.h;
  const cands=[];
  for(const s of solids()){
    if(s.hidden) continue;
    const left=Math.max(preferX,s.x), right=Math.min(preferX+w,s.x+s.w);
    if(right<=left) continue;
    const x=Math.max(0,Math.min(WORLD_W-w,left));
    const y=s.y-h;
    if(!inSpike({x,y,w,h})) cands.push({x,y,sy:s.y});
  }
  if(cands.length){
    cands.sort((a,b)=>b.sy-a.sy);
    return {x:cands[0].x,y:cands[0].y,facing:checkpoint.facing};
  }
  return {x:checkpoint.x,y:checkpoint.y,facing:checkpoint.facing};
}

function saveCheckpoint(){
  if(!player.onGround||dead) return;
  const pb=playerBox();
  if(inSpike(pb)) return;
  checkpoint={x:player.x,y:player.y,facing:player.facing};
}

function respawnPlayer(){
  const spot=findSafeSpawn(player.x);
  player.x=spot.x;
  player.y=spot.y;
  player.facing=spot.facing;
  player.vx=0; player.vy=0;
  player.onGround=true; player.standingOn=null;
  player.crouch=false;
  fx.crash=0; fx.slip=0; fx.smoke=0; fx.brief=0;
  invulnT=1.6;
  dead=false;
  updateHud();
}

function resetGame(){
  player.x=80; player.y=GROUND-player.h; player.vx=0; player.vy=0;
  player.onGround=true; player.facing=1; player.crouch=false;
  lives=MAX_LIVES; score=window.MTProgress?MTProgress.getRunCoins():0; won=false; dead=false; shakeT=0; splashT=0;
  fx={boost:0,crash:0,slip:0,slipDir:1,dry:0,smoke:0,brief:0}; T=0;
  passThroughPlat=null; passThroughT=0; coyoteT=0;
  checkpoint={x:80,y:GROUND-player.h,facing:1}; invulnT=0;
  hasAccessCard=false; hasAppointment=false; hasCeoBadge=false; briefDelivered=false;
  gateWarnT=0; boardRushNotified=-1; prevCrash=0; prevSlip=0;
  ents.forEach(e=>{
    if(e.type==="coin") e.hidden=false;
    if(e.type==="coffee") e.hidden=false;
    if(e.type==="umbrella") e.hidden=false;
    if(e.type==="banana") e.hidden=false;
    if(e.type==="npc"){ e.served=false; e.charge=0; }
    if(e.type==="printer"){ e.served=false; e.charge=0; }
    if(e.type==="dropZone") e.done=false;
    if(e.type==="hazard"&&e.id==="printerSmoke") e.hidden=false;
    if(e.type==="turnstile"){ e.open=false; e.charge=0; }
    if(e.type==="mic"){ e.open=false; e.charge=0; e._unlocked=false; }
    if(e.unlockGroup) e.hidden=true;
    if(e.type==="enemy" && e.dead) delete e.dead;
    if(e.type==="box"){ e.x=e.initX??e.x; e.y=e.initY??e.y; e.hidden=false; e.vy=0; }
    if(e.type==="banana"&&e.initX!==undefined) e.x=e.initX;
    if(e.type==="umbrella"&&e.initX!==undefined) e.x=e.initX;
  });
  document.getElementById("overlay").classList.remove("show");
  prevLives=lives;
  MTUI.resetCollectibles();
  updateHud();
}

function getZoneHint(x){
  if(x<640) return hasAccessCard?"门禁在手，闸机秒开。":"找行政停稳领门禁卡。"
  if(x<1500) return "把 CEO 椅推上桥台，滑过沟。"
  if(x<1880) return hasAppointment?"任命书在手，低门可过。":"打印机旁停稳，等任命书出来。"
  if(x<3100) return hasCeoBadge?"工牌到手，继续往前。":"找秘书蹲下领 CEO 工牌。"
  if(x<4580) return "推档案过桥，第二道闸机再停一次。"
  if(x<5200) return "工牌门需蹲下通过。"
  if(x<5560) return "董事会前有门槛，别带文件夹硬跑。"
  if(x<6280) return "董事会高峰！经理查岗，蹲进工位躲。"
  if(x<6680) return briefDelivered?"文件已交，去落座。":"找助理领文件夹，交到落座区。"
  return "在椅子上停稳落座。"
}

function gateAllowed(g){
  if(g.need==="appointment") return hasAppointment;
  if(g.need==="badge") return hasCeoBadge;
  return true;
}
function gateMsg(g){
  if(g.need==="appointment") return "需要任命书，打印机旁停稳领取";
  if(g.need==="badge") return "需要 CEO 工牌，找秘书蹲下领取";
  return "过不去";
}
function inHideSpot(pb){
  for(const h of ents) if(h.type==="hideSpot"&&aabb(pb,h)) return true;
  return false;
}
function tsInstantOpen(ts){
  if(ts.id==="ts1") return hasAccessCard;
  if(ts.id==="ts2") return hasCeoBadge;
  return false;
}
function giveNpcItem(npc){
  if(npc.give==="access"){
    hasAccessCard=true;
    ents.forEach(t=>{ if(t.type==="turnstile"&&t.id==="ts1"){ t.open=true; t.charge=1; } });
    MTUI.toast("门禁卡到手");
  } else if(npc.give==="badge"){
    hasCeoBadge=true;
    ents.forEach(t=>{ if(t.type==="turnstile"&&t.id==="ts2"){ t.open=true; t.charge=1; } });
    MTUI.toast("CEO 工牌到手");
  } else if(npc.give==="brief"){
    fx.brief=BRIEF_TIME;
    MTUI.toast("决策文件夹 · 别跑别摔");
  }
  sfx.pickup();
  updateHud();
}
function dropBrief(stumble){
  if(fx.brief<=0) return;
  fx.brief=0;
  updateHud();
  if(briefDelivered) return;
  if(stumble){
    shakeT=0.22; sfx.bump();
    const npc=ents.find(n=>n.type==="npc"&&n.give==="brief");
    if(npc){ npc.served=false; npc.charge=0; }
    MTUI.toast("文件夹掉了！回助理处重领");
  }
}

function getBriefCollectState(){
  if(briefDelivered) return true;
  if(fx.brief > 0) return "active";
  return false;
}

function updateHud(){
  const pi=document.getElementById("ui_power_icon");
  MTUI.updateLives(lives, MAX_LIVES, lives<prevLives);
  prevLives=lives;
  document.getElementById("ui_score").innerHTML='<span class="lbl">MT币</span>'+score;
  MTUI.updateProgress(player.x/Math.max(1,WORLD_W-200));
  MTUI.updateHint(getZoneHint(player.x));
  MTUI.updateCollectibles({
    access: hasAccessCard,
    appointment: hasAppointment,
    badge: hasCeoBadge,
    brief: getBriefCollectState(),
    deliver: briefDelivered
  });
  if(fx.boost>0){
    pi.style.display="inline-flex"; pi.className="stat fx boost";
    pi.innerHTML='<span class="lbl">加速</span>'+fx.boost.toFixed(1)+'s';
  } else if(fx.crash>0){
    pi.style.display="inline-flex"; pi.className="stat fx crash";
    pi.innerHTML='<span class="lbl">停不住</span>'+fx.crash.toFixed(1)+'s';
  } else if(fx.slip>0){
    pi.style.display="inline-flex"; pi.className="stat fx slip";
    pi.innerHTML='<span class="lbl">打滑</span>'+fx.slip.toFixed(1)+'s';
  } else if(fx.dry>0){
    pi.style.display="inline-flex"; pi.className="stat fx dry";
    pi.innerHTML='<span class="lbl">防湿</span>'+fx.dry.toFixed(0)+'s';
  } else if(fx.smoke>0){
    pi.style.display="inline-flex"; pi.className="stat fx smoke";
    pi.innerHTML='<span class="lbl">呛</span>'+fx.smoke.toFixed(1)+'s';
  } else if(fx.brief>0){
    pi.style.display="inline-flex"; pi.className="stat fx brief";
    pi.innerHTML='<span class="lbl">文件夹</span>'+fx.brief.toFixed(0)+'s';
  } else pi.style.display="none";
}

function doJump(){
  if(!MTUI.isActive()||won||dead) return;
  if(player.crouch) return;
  if(fx.slip>0) return;
  if(!player.onGround && coyoteT<=0) return;
  const boost=fx.boost>0;
  const wet=inPuddle(playerBox())&&fx.dry<=0;
  let j=boost?JUMP_BOOST:JUMP;
  if(wet) j*=0.68;
  player.vy=-j;
  player.onGround=false;
  coyoteT=0;
  sfx.jump();
  spawnDust(player.x+player.w/2, player.y+player.h, 6);
}

function unlockMicGroup(key){
  ents.forEach(e=>{ if(e.unlockGroup===key) e.hidden=false; });
}
function pickCoffee(e){ e.hidden=true; fx.boost=4; fx.crash=0; sfx.pickup(); updateHud(); }
function pickUmbrella(e){ e.hidden=true; fx.dry=14; sfx.pickup(); updateHud(); }
function stepBanana(e){
  e.hidden=true; fx.slip=1.7; fx.slipDir=player.facing||1;
  if(fx.brief>0) dropBrief(true);
  sfx.slip(); shakeT=0.2; player.onGround=false; player.vy=-80;
  spawnDust(e.x+e.w/2,e.y,10);
  for(let i=0;i<6;i++) particles.push({x:e.x+e.w/2,y:e.y,vx:(Math.random()-0.5)*200,vy:-40-Math.random()*80,life:0,max:0.35,r:2+Math.random()*2,col:"#ffe066"});
  updateHud();
}

function stopCrash(){
  if(fx.crash<=0) return;
  fx.crash=0; player.vx=0; sfx.bump(); updateHud();
}

function spawnDust(x,y,n){ for(let i=0;i<n;i++) particles.push({x,y:y-2,vx:(Math.random()-0.5)*160,vy:-20-Math.random()*100,life:0,max:0.3+Math.random()*0.3,r:1.5+Math.random()*2}); }

function die(){
  if(dead) return;
  lives--; sfx.die(); shakeT=0.35;
  if(lives<=0){
    dead=true;
    setTimeout(()=>{
      MTUI.tryCoinContinue({
        score,
        gameOverCfg:{
          tag:"失败",
          title:"还没落座",
          body:"生命用完了。"
        },
        onRevive(cost){
          score-=cost;
          lives=1;
          dead=false;
          respawnPlayer();
          updateHud();
          MTUI.toast(`-${cost} MT币，续命！`);
        }
      });
    },600);
  } else {
    dead=true;
    setTimeout(respawnPlayer,700);
  }
}

function showGameOver(){
  MTUI.showGameOver({
    tag:"失败",
    title:"还没落座",
    body:"生命用完了。"
  });
}

function win(){
  if(won) return;
  const sitMic=ents.find(m=>m.type==="mic"&&m.unlock==="sit");
  if(sitMic&&!sitMic.open) return;
  won=true; sfx.win();
  if(window.MTProgress){
    MTProgress.completeLevel(5);
    MTProgress.setRunCoins(score);
  }
  if(window.MTUI) MTUI.track("level_win", { score, livesLeft: lives });
  MTUI.toast("落座成功……");
  setTimeout(()=>{ location.href="mt-epilogue.html"; },400);
}

function update(dt){
  if(won) return;
  if(dead) return;
  if(!MTUI.isActive()) return;
  T+=dt;

  if(fx.boost>0){ fx.boost-=dt; if(fx.boost<=0){ fx.boost=0; fx.crash=2.4; updateHud(); } }
  if(fx.crash>0) fx.crash-=dt;
  if(fx.slip>0) fx.slip-=dt;
  if(fx.dry>0) fx.dry-=dt;
  if(fx.smoke>0) fx.smoke-=dt;
  if(fx.brief>0){
    fx.brief-=dt;
    if(fx.brief<=0){
      fx.brief=0;
      if(!briefDelivered){
        const npc=ents.find(n=>n.type==="npc"&&n.give==="brief");
        if(npc){ npc.served=false; npc.charge=0; }
        MTUI.toast("文件夹超时，回助理处重领");
      }
      updateHud();
    }
  }
  if(fx.slip>0 && prevSlip<=0 && fx.brief>0) dropBrief(true);
  if(fx.crash>0 && prevCrash<=0 && fx.brief>0) dropBrief(true);
  prevSlip=fx.slip; prevCrash=fx.crash;
  if(gateWarnT>0) gateWarnT-=dt;
  if(invulnT>0) invulnT-=dt;
  if(passThroughT>0) passThroughT-=dt;

  ents.forEach(e=>{ if(e.type==="mover"){
    if(e.baseX===undefined){ e.baseX=e.x; e.prevOff=0; }
    const off=Math.sin(T*e.speed)*e.range, d=off-e.prevOff;
    e.x=e.baseX+off;
    if(player.standingOn===e) player.x+=d;
    e.prevOff=off;
  }});

  ents.forEach(b=>{ if(b.type==="box"&&!b.hidden){
    b.vy=(b.vy||0)+GRAV*dt; b.y+=b.vy*dt;
    solids().forEach(s=>{
      if(s===b||s.type==="box") return;
      if(!boxSolidBlocks(b,s)||b.vy<0||b.y+b.h-b.vy*dt>s.y+8) return;
      b.y=s.y-b.h; b.vy=0;
    });
    if(b.y>GROUND+80 && b.initX!==undefined){ b.x=b.initX; b.y=b.initY??GROUND-52; b.vy=0; }
  }});

  ents.forEach(en=>{ if(en.type==="enemy"&&!en.dead){
    const boardRush=(T%12)<3.2;
    let spd=en.fast?1.45:1.08;
    if(boardRush&&en.x>5200) spd*=1.35;
    en.x+=en.vx*spd*dt;
    if(en.x<=en.patrol[0]){ en.x=en.patrol[0]; en.vx=Math.abs(en.vx); }
    if(en.x+en.w>=en.patrol[1]){ en.x=en.patrol[1]-en.w; en.vx=-Math.abs(en.vx); }
  }});

  const rushCycle=Math.floor(T/12);
  if((T%12)<0.35&&rushCycle!==boardRushNotified&&player.x>5200){
    boardRushNotified=rushCycle;
    MTUI.toast("董事会高峰！经理和同事加快了");
  }

  // 打印机烟雾（有任命书后停烟）
  const smokeH=ents.find(h=>h.id==="printerSmoke");
  if(smokeH) smokeH.hidden=hasAppointment;
  for(const h of ents){
    if(h.type!=="hazard"||h.hidden) continue;
    const c=h.cycle||4, o=h.activeT||1.5;
    h.active=((T+(h.phase||0))%c)<o;
  }

  player.crouch=keys.down && player.onGround && !fx.crash && fx.slip<=0;

  // 浮空平台上按住 ↓ → 穿落下去
  if(keys.down && player.onGround && player.standingOn && isFloatPlat(player.standingOn)){
    passThroughPlat=player.standingOn; passThroughT=0.3;
    player.onGround=false; player.standingOn=null; player.vy=120;
  }

  let dir=(keys.right?1:0)-(keys.left?1:0);
  const pbPre=playerBox();
  const wet=inPuddle(pbPre)&&fx.dry<=0;

  if(fx.slip>0){
    player.vx=fx.slipDir*RUN*0.92;
    if(dir) player.facing=dir;
  } else if(fx.crash>0){
    player.vx=player.facing*(fx.boost>0?RUN*1.2:RUN);
  } else {
    const canRun=keys.run&&!player.crouch&&fx.brief<=0;
    let spd=((canRun)||fx.boost>0)?RUN:MOVE;
    if(player.crouch) spd*=0.45;
    if(wet) spd*=0.42;
    if(fx.smoke>0) spd*=0.55;
    if(fx.brief>0) spd*=0.76;
    if(fx.boost>0 && !dir) player.vx=player.facing*spd*0.6;
    else { player.vx=dir*spd; if(dir) player.facing=dir; }
  }

  if(dir&&player.onGround&&!player.crouch){
    player.walkT+=dt; stepTimer-=dt;
    if(stepTimer<=0){
      sfx.step();
      if(wet){ sfx.splash(); splashT=0.12; spawnDust(player.x+player.w/2-dir*6,player.y+player.h,4); }
      else spawnDust(player.x+player.w/2-dir*6,player.y+player.h,2);
      stepTimer=wet?0.28:0.22;
    }
  }

  const pbBefore=playerBox();
  const prevFeetStomp=pbBefore.y+pbBefore.h;
  player.vy+=GRAV*dt;
  moveX(player.vx*dt);
  moveY(player.vy*dt);

  // 捡物
  const pb=playerBox();
  for(const e of ents){
    if(e.type==="coin"&&!e.hidden&&aabb(pb,e)){ e.hidden=true; score+=10; sfx.coin(); }
    if(e.type==="coffee"&&!e.hidden&&aabb(pb,e)) pickCoffee(e);
    if(e.type==="umbrella"&&!e.hidden&&aabb(pb,e)) pickUmbrella(e);
    if(e.type==="banana"&&!e.hidden&&aabb(pb,e)&&(player.onGround||player.vy>80)) stepBanana(e);
    if(e.type==="dropZone"&&!e.done&&fx.brief>0&&player.onGround&&aabb(pb,e)){
      fx.brief=0; e.done=true; briefDelivered=true;
      score+=80; sfx.coin(); MTUI.toast("+80 MT币 文件已交"); updateHud();
    }
  }

  // 打印机：停稳出任命书
  for(const pr of ents){
    if(pr.type!=="printer"||pr.served) continue;
    const zone={x:pr.x-20,y:pr.y-8,w:pr.w+40,h:pr.h+16};
    if(!aabb(pb,zone)){ pr.charge=Math.max(0,(pr.charge||0)-dt*1.8); continue; }
    const still=Math.abs(player.vx)<18&&player.onGround;
    if(still||player.crouch) pr.charge=Math.min(1,(pr.charge||0)+dt*(player.crouch?1.9:1.5));
    else pr.charge=Math.max(0,(pr.charge||0)-dt*3);
    if(pr.charge>=0.85){
      pr.served=true; pr.charge=1; hasAppointment=true;
      sfx.pickup(); MTUI.toast("任命书打印好了"); updateHud();
    }
  }

  // NPC 交付
  for(const npc of ents){
    if(npc.type!=="npc"||npc.served) continue;
    const zone={x:npc.x-16,y:npc.y-8,w:npc.w+32,h:npc.h+12};
    if(!aabb(pb,zone)){ npc.charge=Math.max(0,(npc.charge||0)-dt*1.5); continue; }
    if(npc.give==="badge"&&!hasAppointment){
      if(gateWarnT<=0){ gateWarnT=1.2; MTUI.toast("先等打印机出任命书"); }
      npc.charge=Math.max(0,(npc.charge||0)-dt*2.5);
      continue;
    }
    if(npc.give==="brief"&&fx.brief>0){ npc.charge=1; continue; }
    if(npc.give==="badge"&&hasCeoBadge){ npc.served=true; npc.charge=1; continue; }
    if(npc.give==="access"&&hasAccessCard){ npc.served=true; npc.charge=1; continue; }
    if(npc.give==="brief"&&!hasCeoBadge){
      if(gateWarnT<=0){ gateWarnT=1.2; MTUI.toast("先找秘书领 CEO 工牌"); }
      npc.charge=Math.max(0,(npc.charge||0)-dt*2.5);
      continue;
    }
    const still=Math.abs(player.vx)<18&&player.onGround;
    const ok=npc.need==="crouch" ? player.crouch&&still : (player.crouch||still);
    if(ok) npc.charge=Math.min(1,(npc.charge||0)+dt*(player.crouch?2.0:1.5));
    else npc.charge=Math.max(0,(npc.charge||0)-dt*3);
    if(npc.charge>=0.85){
      npc.served=true; npc.charge=1;
      giveNpcItem(npc);
    }
  }

  // 敌人
  for(const en of ents){ if(en.type==="enemy"&&!en.dead&&aabb(pb,en)){
    if(invulnT>0) continue;
    if(en.id==="manager"&&player.crouch&&inHideSpot(pb)) continue;
    if(canStompEnemy(pb,en,player.vy,prevFeetStomp)){
      en.dead=true; player.vy=-420; sfx.stomp(); score+=50;
    } else {
      if(fx.brief>0){ dropBrief(true); invulnT=0.8; }
      else die();
    }
  }}

  // 烟雾 / 尖刺 / 掉坑
  for(const h of ents){
    if(h.type==="hazard"&&h.active&&aabb(pb,h)){
      fx.smoke=Math.min(2.8,fx.smoke+dt*2.2);
      if(fx.crash<=0&&fx.slip<=0&&player.onGround) player.vx*=0.86;
    }
  }
  if(invulnT<=0){
    for(const e of ents){ if(e.type==="spike"&&aabb(pb,e)) die(); }
  }
  if(player.y>VH+60) die();

  // 闸机 / 落座话筒
  for(const ts of ents){
    if(ts.type!=="turnstile"&&ts.type!=="mic") continue;
    const pad=ts.padX||24;
    const zone={x:ts.x-pad,y:ts.type==="mic"?ts.y-10:GROUND-62,w:ts.w+pad*2,h:ts.type==="mic"?ts.h+20:64};
    if(!aabb(pb,zone)){ ts.charge=Math.max(0,(ts.charge||0)-dt*2); continue; }
    if(ts.type==="turnstile"){
      if(tsInstantOpen(ts)||ts.open){ ts.open=true; ts.charge=1; continue; }
      const still=Math.abs(player.vx)<18&&player.onGround;
      if(player.crouch||still) ts.charge=Math.min(1,(ts.charge||0)+dt*(player.crouch?2.2:1.2));
      else ts.charge=Math.max(0,(ts.charge||0)-dt*3.5);
      if(ts.charge>=0.72) ts.open=true;
      if(ts.open) continue;
      const bar={x:ts.x,y:ts.y+8,w:ts.w,h:ts.h-8};
      if(!aabb(pb,bar)) continue;
      if(fx.crash>0){ stopCrash(); player.vx=-player.facing*RUN*0.85; sfx.bump(); break; }
      if(fx.brief>0&&Math.abs(player.vx)>280){ dropBrief(true); player.vx=-player.facing*RUN*0.7; sfx.bump(); break; }
      player.vx=0;
      if(player.facing>0) player.x=ts.x-pb.w+(player.x-pb.x);
      else player.x=ts.x+ts.w+(player.x-pb.x);
      sfx.bump(); break;
    }
    if(ts.type==="mic"){
      const need=ts.need??0.65;
      const still=Math.abs(player.vx)<18&&player.onGround;
      if(!briefDelivered){ ts.charge=Math.max(0,(ts.charge||0)-dt*4); continue; }
      if(fx.crash>0){ ts.charge=Math.max(0,(ts.charge||0)-dt*4); continue; }
      if(player.crouch||still) ts.charge=Math.min(need,(ts.charge||0)+dt*(player.crouch?2.2:1.2));
      else ts.charge=Math.max(0,(ts.charge||0)-dt*3);
      if(ts.charge>=need){
        ts.open=true;
        if(!ts._unlocked){ ts._unlocked=true; unlockMicGroup(ts.unlock); sfx.pickup(); MTUI.toast("落座"); }
      }
    }
  }

  // 低门：需手续；手续不足蹲也过不去，手续够则蹲下钻过
  for(const g of ents){
    if(g.type!=="gate") continue;
    const passZone={x:g.x-4,y:GROUND-52,w:g.w+8,h:52};
    if(!aabb(pb,passZone)) continue;
    if(!gateAllowed(g)){
      if(fx.crash>0){ stopCrash(); break; }
      player.vx=0;
      if(player.facing>0) player.x=g.x-pb.w+(player.x-pb.x)-8;
      else player.x=g.x+g.w+(player.x-pb.x)+8;
      sfx.bump();
      if(gateWarnT<=0){ gateWarnT=1.2; MTUI.toast(gateMsg(g)); }
      break;
    }
    const bar=gateBar(g);
    if(!aabb(pb,bar)) continue;
    if(player.crouch) continue;
    if(fx.crash>0){ stopCrash(); break; }
    player.vx=0;
    if(player.facing>0) player.x=g.x-pb.w+(player.x-pb.x);
    else player.x=g.x+g.w+(player.x-pb.x);
    sfx.bump();
    break;
  }

  // Goal（须先落座）
  for(const g of ents){
    if(g.type!=="goal"||g.hidden||!aabb(pb,g)) continue;
    const sitMic=ents.find(m=>m.type==="mic"&&m.unlock==="sit");
    if(sitMic&&!sitMic.open){ MTUI.toast("先落座"); continue; }
    win();
  }

  // 相机
  const target=player.x-VW*0.32;
  camX+=(target-camX)*Math.min(1,dt*8);
  camX=Math.max(0,Math.min(WORLD_W-VW,camX));

  for(const pt of particles){ pt.life+=dt; pt.vy+=900*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; }
  particles=particles.filter(pt=>pt.life<pt.max);
  if(splashT>0) splashT=Math.max(0,splashT-dt);
  if(player.squashT>0) player.squashT=Math.max(0,player.squashT-dt);
  if(!player.onGround) coyoteT=Math.max(0,coyoteT-dt);
  saveCheckpoint();
  updateHud();
}

function moveX(dx){
  if(!dx){ return; }
  const ox=player.x;
  player.x+=dx;
  const pb=playerBox();
  let blocked=false;
  for(const s of solids()){
    if(!solidBlocksX(pb,s)) continue;
    blocked=true;
    const off=player.x-pb.x;
    if(s.type==="box"){
      const pen=dx>0?(pb.x+pb.w)-s.x:pb.x-(s.x+s.w);
      const pushMul=s.heavy?0.72:1;
      s.x+=pen*pushMul; let boxBlocked=false, mounted=false;
      for(const o of solids()){
        if(o===s||o.type==="box") continue;
        if(!boxSolidBlocks(s,o)) continue;
        if(dx>0&&tryMountBox(s,o,pen)){ mounted=true; break; }
        boxBlocked=true; break;
      }
      if(boxBlocked) s.x-=pen*pushMul;
      else if(dx) sfx.push();
      if(dx>0) player.x=s.x-pb.w+off; else player.x=s.x+s.w+off;
    } else {
      if(dx>0) player.x=s.x-pb.w+off; else player.x=s.x+s.w+off;
    }
  }
  const beforeClamp=player.x;
  player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));
  if(fx.crash>0){
    const moved=Math.abs(player.x-ox), want=Math.abs(dx);
    if(blocked || beforeClamp!==player.x || (want>0.5 && moved<want*0.35)) stopCrash();
  }
  if(fx.slip>0 && blocked){ fx.slip=0; player.vx=0; sfx.bump(); updateHud(); }
}

function moveY(dy){
  const prevPb=playerBox();
  const prevFeet=prevPb.y+prevPb.h;
  player.y+=dy;
  const was=player.onGround;
  player.onGround=false; player.standingOn=null;
  const pb=playerBox();

  for(const s of solids()){
    if(!solidBlocksY(pb,s,dy,prevFeet)) continue;
    if(dy>0){
      player.y=s.y-player.h; player.vy=0; player.onGround=true; player.standingOn=s;
      if(fx.crash>0 && !was) stopCrash();   // 空中落地才刹停
    } else if(dy<0){
      player.y=s.y+s.h-(pb.y-player.y)-pb.h; player.vy=0;
      if(fx.crash>0) stopCrash();            // 顶到天花板
    }
  }
  if(player.onGround&&!was){ sfx.land(); player.squashT=0.15; spawnDust(player.x+player.w/2,player.y+player.h,8); }
  if(player.onGround) coyoteT=0.1;
}

let _seed=1;
function srand(s){ _seed=s>>>0; }
function rnd(){ _seed=(_seed*1664525+1013904223)>>>0; return _seed/4294967296; }
function jit(a){ return (rnd()-0.5)*a; }
function rline(x1,y1,x2,y2){ const mx=(x1+x2)/2+jit(3),my=(y1+y2)/2+jit(3);
  ctx.beginPath(); ctx.moveTo(x1+jit(1),y1+jit(1)); ctx.quadraticCurveTo(mx,my,x2+jit(1),y2+jit(1)); ctx.stroke(); }
function rrect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }

      }
      if(e.type==="mover"){
        ctx.fillStyle=INK; ctx.font="600 11px PingFang SC,sans-serif"; ctx.textAlign="center";
        ctx.fillText(e.label||"移动台",e.x+e.w/2,e.y+12); ctx.textAlign="left";
      }
    } else if(e.type==="box"){
      ctx.fillStyle="#fff"; ctx.lineWidth=2.5;
      rrect(e.x,e.y,e.w,e.h,4); fillStroke();
      ctx.strokeStyle=INK; ctx.lineWidth=2;
      rline(e.x+8,e.y+14,e.x+e.w-8,e.y+14); rline(e.x+14,e.y+22,e.x+e.w-14,e.y+36);
      ctx.font="600 10px PingFang SC,sans-serif"; ctx.textAlign="center"; ctx.fillStyle=INK;
      ctx.fillText(e.label||"快递",e.x+e.w/2,e.y+e.h-8); ctx.textAlign="left";
    } else if(e.type==="spike"){
      ctx.lineWidth=2; ctx.fillStyle="#fff8ea"; ctx.strokeStyle=INK;
      for(let i=0;i<Math.floor(e.w/20);i++){ const sx=e.x+i*20;
        ctx.beginPath(); ctx.moveTo(sx,e.y+e.h); ctx.lineTo(sx+10,e.y+jit(2)); ctx.lineTo(sx+20,e.y+e.h); ctx.closePath(); fillStroke(); }
    } else if(e.type==="gate"){
      const barH=12;
      ctx.fillStyle=INK; ctx.lineWidth=2.5;
      rrect(e.x,e.y,e.w,barH,2); ctx.fill();
      ctx.strokeStyle=INK;
      rline(e.x+5,e.y+barH,e.x+5,e.y+e.h); rline(e.x+e.w-5,e.y+barH,e.x+e.w-5,e.y+e.h);
      ctx.fillStyle="rgba(42,42,42,.4)"; ctx.font="600 10px PingFang SC,sans-serif"; ctx.textAlign="center";
      const gateLbl=e.need==="appointment"?"任命书":(e.need==="badge"?"工牌":"蹲");
      ctx.fillText(gateLbl,e.x+e.w/2,e.y+e.h-8); ctx.textAlign="left";
    } else if(e.type==="npc"){
      drawNpc(e);
    } else if(e.type==="dropZone"){
      drawDropZone(e);
    } else if(e.type==="hideSpot"){
      drawHideSpot(e);
    } else if(e.type==="turnstile"){
      drawTurnstile(e);
    } else if(e.type==="mic"){
      drawMic(e);
    } else if(e.type==="printer"){
      drawPrinter(e);
    } else if(e.type==="door"){
      drawDoor(e);
    } else if(e.type==="hazard"){
      drawHazard(e);
    } else if(e.type==="coin"){
      const cx=e.x+e.w/2, cy=e.y+e.h/2, r=8;
      ctx.fillStyle="#ffe08a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle="rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(cx-2,cy-2,2.5,0,7); ctx.fill();
      ctx.fillStyle=INK; ctx.font="700 8px sans-serif"; ctx.textAlign="center"; ctx.fillText("M",cx,cy+3); ctx.textAlign="left";
    } else if(e.type==="coffee"){
      drawCoffee(e);
    } else if(e.type==="banana"){
      drawBanana(e);
    } else if(e.type==="puddle"){
      drawPuddle(e);
    } else if(e.type==="umbrella"){
      drawSlippers(e);
    } else if(e.type==="enemy"&&!e.dead){
      drawEnemy(e);
    } else if(e.type==="goal"){
      ctx.lineWidth=2.5; ctx.strokeStyle=INK;
      rline(e.x+8,e.y+16,e.x+8,GROUND); rline(e.x+e.w-8,e.y+16,e.x+e.w-8,GROUND);
      ctx.setLineDash([6,5]); rline(e.x,e.y+22,e.x+e.w,e.y+22); ctx.setLineDash([]);
      ctx.fillStyle=INK; ctx.font="700 12px PingFang SC,sans-serif"; ctx.textAlign="center";
      ctx.fillText("CEO",e.x+e.w/2,e.y+14); ctx.textAlign="left";
    }
  }

  ctx.lineWidth=3; rline(0,GROUND,WORLD_W,GROUND);
  ctx.restore();
}


function drawEnemyVector(e,facing){
  const walk=Math.sin(T*10+ e.x*0.02);
  const BLK=INK;
  ctx.save();
  ctx.translate(e.x+e.w/2,e.y+e.h);
  if(facing<0) ctx.scale(-1,1);
  ctx.lineCap="round"; ctx.lineJoin="round";
  // 腿
  ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-5,-12); ctx.lineTo(-5-walk*4,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5-walk*4,0); ctx.lineTo(-5-walk*4+facing*5,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5,-12); ctx.lineTo(5+walk*4,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5+walk*4,0); ctx.lineTo(5+walk*4+facing*5,0); ctx.stroke();
  // 身体（比 Zack 瘦一点、浅色衫）
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-8,-36); ctx.quadraticCurveTo(-10,-24,-7,-12);
  ctx.lineTo(7,-12); ctx.quadraticCurveTo(10,-24,8,-36); ctx.closePath(); fillStroke();
  // 通勤包
  ctx.fillStyle="#e8dfd3"; ctx.strokeStyle=BLK; ctx.lineWidth=1.8;
  ctx.strokeRect(6,-28,7,10); ctx.fillRect(6,-28,7,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,-28); ctx.lineTo(9,-32); ctx.stroke();
  // 手臂
  ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-7,-30); ctx.lineTo(-11,-22+walk*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7,-30); ctx.lineTo(12,-24-walk*2); ctx.stroke();
  // 头
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,-40,9,0,7); ctx.fill(); ctx.stroke();
  // 脸（无眼镜，和 Zack 区分）
  ctx.fillStyle=BLK;
  ctx.beginPath(); ctx.arc(-3,-41,1.5,0,7); ctx.arc(3,-41,1.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3,-36); ctx.quadraticCurveTo(0,-35,3,-36); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e){
  const facing=e.vx>=0?1:-1;
  const spr=enemySprites.walk;
  const cx=e.x+e.w/2, foot=e.y+e.h;
  const bob=Math.sin(T*10+e.x*0.02)*1.5;
  if(spr){
    ctx.save();
    ctx.translate(cx,foot+bob);
    if(facing<0) ctx.scale(-1,1);
    const dh=e.h+4, dw=dh*(spr.width/spr.height);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(spr,-dw/2,-dh,dw,dh);
    ctx.restore();
  } else {
    drawEnemyVector(e,facing);
  }
}
bgSlots.forEach(s=>loadBg(s.id));
signSlots.forEach(s=>loadBg(s.id,s.alt));

loadSprite(IMG+"hero.png","idle");
loadSprite(IMG+"hero_jump.png","jump");
loadSprite(IMG+"hero_run.png","run");

function drawPlayer(){
  const p=player; const cx=p.x+p.w/2-camX, footY=p.y+p.h;
  const air=!p.onGround, moving=keys.left||keys.right||Math.abs(p.vx)>30;
  // 挤压拉伸形变（以脚底为锚点）
  let sx=1, sy=1;
  if(p.squashT>0){ const k=p.squashT/0.18; sy=1-0.30*k; sx=1+0.30*k; }
  else if(p.crouch&&p.onGround){ sy=0.58; sx=1.08; }
  else if(air){ const st=Math.max(0,Math.min(0.34,Math.abs(p.vy)/3000)); sy=1+st; sx=1-st*0.55; }
  // 按动作选贴图
  let spr;
  if(air) spr=sprites.jump||sprites.idle;
  else if(moving&&!p.crouch) spr=sprites.run||sprites.idle;
  else spr=sprites.idle;
  ctx.save();
  if(invulnT>0 && Math.sin(T*24)>0) ctx.globalAlpha=0.45;
  ctx.translate(cx, footY);
  ctx.scale(sx, sy);
  if(dead) ctx.rotate(p.facing*1.25);
  else if(fx.slip>0) ctx.rotate(Math.sin(T*28)*0.38*(p.facing||1));
  else if(air) ctx.rotate(Math.max(-0.2,Math.min(0.22, p.vy/3800))*(p.facing||1));
  if(spr){
    const dh=80, dw=dh*(spr.width/spr.height);
    if(p.facing<0) ctx.scale(-1,1);
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(spr, -dw/2, -dh, dw, dh);
  } else {
    drawGuyVector(p);   // 没有贴图时回退到矢量绘制
  }
  ctx.restore();
  if(fx.brief>0){
    ctx.save();
    ctx.translate(p.x+p.w/2-camX, p.y+p.h-52);
    if(p.facing<0) ctx.scale(-1,1);
    ctx.fillStyle="#2a4060"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    rrect(-14,-6,28,20,3); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#fff"; ctx.font="700 8px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("决策",0,8); ctx.textAlign="left";
    ctx.restore();
  }
}

function drawGuyVector(p){
  const walking = p.onGround && (keys.left||keys.right);
  const walk = walking ? Math.sin(p.walkT*12) : 0;
  const air = !p.onGround;
  const BLK="#1c1c1c";
  ctx.lineJoin="round"; ctx.lineCap="round";

  // 腿 + 带方向的小脚
  ctx.strokeStyle=BLK; ctx.lineWidth=4.5;
  const lA = air ? 3 : (5 + walk*5);
  const lB = air ? 3 : (5 - walk*5);
  ctx.beginPath(); ctx.moveTo(-6,-13); ctx.lineTo(-6-lA*0.5,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6-lA*0.5,0); ctx.lineTo(-6-lA*0.5+p.facing*6,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,-13);  ctx.lineTo(6+lB*0.5,-1);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6+lB*0.5,0);  ctx.lineTo(6+lB*0.5+p.facing*6,0); ctx.stroke();

  // 身体（黑衬衫，圆胖）
  const bTop=-37, bBot=-12;
  ctx.fillStyle=BLK; ctx.strokeStyle=BLK; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-9,bTop);
  ctx.bezierCurveTo(-22,bTop+5,-21,bBot-3,-15,bBot);
  ctx.quadraticCurveTo(0,bBot+7,15,bBot);
  ctx.bezierCurveTo(21,bBot-3,22,bTop+5,9,bTop);
  ctx.closePath(); ctx.fill();

  // 手臂（黑粗线，圆头手；空中上扬 / 走路前后摆）
  ctx.strokeStyle=BLK; ctx.lineWidth=5;
  const armS = air ? -9 : walk*3;
  ctx.beginPath(); ctx.moveTo(-13,bTop+6); ctx.quadraticCurveTo(-23,bTop+16,-22,bTop+27+armS); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13,bTop+6);  ctx.quadraticCurveTo(23,bTop+16,22,bTop+27-armS);  ctx.stroke();

  // 工牌
  ctx.fillStyle="#fff"; ctx.strokeStyle=BLK; ctx.lineWidth=1.2;
  rrect(-8,bTop-10,16,8,2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=BLK; ctx.font="bold 5px sans-serif"; ctx.textAlign="center";
  ctx.fillText("CEO",0,bTop-4); ctx.textAlign="left";
  ctx.strokeStyle="#fff"; ctx.fillStyle="#fff"; ctx.lineWidth=1.7;
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(1,bBot+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(-9,bTop+1); ctx.lineTo(-3,bTop+10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1,bTop+7); ctx.lineTo(11,bTop+1); ctx.lineTo(5,bTop+10); ctx.stroke();
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(1,bTop+14+i*6,1.4,0,7); ctx.fill(); }

  // 头（白 黑边）
  const hY=-50, hR=13;
  ctx.fillStyle="#fdfdfd"; ctx.strokeStyle=BLK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,hY,hR,0,7); ctx.fill(); ctx.stroke();

  // 寸头发茬（只在左半边到头顶，右边是光的；随朝向镜像）
  ctx.lineWidth=1.7;
  for(let a=-Math.PI*1.02; a<=-Math.PI*0.32; a+=Math.PI*0.052){
    const ang = p.facing>=0 ? a : (-Math.PI - a);
    const hx=Math.cos(ang)*hR, hy=hY+Math.sin(ang)*hR;
    ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+Math.cos(ang)*6, hy+Math.sin(ang)*6); ctx.stroke();
  }

  const fx=p.facing*2;
  if(dead){
    ctx.strokeStyle=BLK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(fx-9,hY-3); ctx.lineTo(fx-3,hY+3); ctx.moveTo(fx-3,hY-3); ctx.lineTo(fx-9,hY+3);
    ctx.moveTo(fx+3,hY-3); ctx.lineTo(fx+9,hY+3); ctx.moveTo(fx+9,hY-3); ctx.lineTo(fx+3,hY+3); ctx.stroke();
  } else {
    // 黑框方形眼镜
    function lens(cxL){ const w=11,h=8,r=2.5,x=fx+cxL-w/2,y=hY-1-h/2;
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
      ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
      ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); }
    ctx.fillStyle="#fdfdfd"; ctx.strokeStyle=BLK; ctx.lineWidth=2.3;
    lens(-6); ctx.fill(); ctx.stroke();
    lens(7);  ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx-0.5,hY-1); ctx.lineTo(fx+1.5,hY-1); ctx.stroke();      // 横梁
    ctx.beginPath(); ctx.moveTo(fx-11.5,hY-2); ctx.lineTo(fx-15,hY-4); ctx.stroke();      // 镜腿
    // 眼睛（大黑点）
    ctx.fillStyle=BLK;
    ctx.beginPath(); ctx.arc(fx-6,hY-1,2.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(fx+7,hY-1,2.6,0,7); ctx.fill();
    // 嘴（略撇的平嘴）
    ctx.strokeStyle=BLK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx-5,hY+9); ctx.quadraticCurveTo(fx,hY+7,fx+5,hY+9); ctx.stroke();
  }
}
function drawParticles(){
  for(const pt of particles){
    const a=Math.max(0,1-pt.life/pt.max);
    ctx.globalAlpha=a*0.55; ctx.fillStyle=pt.col||"#888";
    ctx.beginPath(); ctx.arc(pt.x-camX,pt.y,pt.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.save();
  if(shakeT>0){ shakeT-=0.016; ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6); }
  drawBackground(); drawWorld(); drawParticles(); drawPlayer(); drawFog();
  ctx.restore();
}

let last=0;
function loop(t){
  const dt=Math.min(0.033,(t-last)/1000||0); last=t;
  if(MTUI.isActive()) update(dt);
  render();
  MTUI.syncKeys(keys);
  requestAnimationFrame(loop);
}

/* ===== 输入 & UI ===== */
MTUI.bindKeys(keys, doJump, ensureAudio);
MTProgress.guardLevel(5);
MTUI.init({
  levelId: 5,
  levelTag:"关卡5",
  homeUrl:"../index.html",
  defaultHint:"CEO办公室，终于到了……",
  collectibles: [
    { id: "access", label: "门禁卡" },
    { id: "appointment", label: "任命书" },
    { id: "badge", label: "CEO工牌" },
    { id: "brief", label: "决策文件夹" },
    { id: "deliver", label: "文件交付" }
  ],
  startTitle:"CEO办公室",
  startBody:"正式上任前需要集齐需要的文件，快去寻找它们吧！",
  startBtn:"进入CEO办公室",
  ensureAudio,
  toggleSound(){ soundOn=!soundOn; if(window.MTBGM) MTBGM.setSoundOn(soundOn); return soundOn; },
  getSessionStats(){ return { score, livesLeft: lives }; },
  isTerminal(){ return won||lives<=0; },
  onBeforeStart(){ resetGame(); },
  onRetry(){ resetGame(); },
  onInit(){ resetGame(); }
});
requestAnimationFrame(loop);
